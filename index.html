<style>

.opt.on{border-color:var(--ac);color:var(--ac)}
.opt.lock{opacity:.45}.pips i.o{background:rgba(198,255,61,.35)}
.opt small{color:var(--mu);font-weight:600;margin-left:4px}
.opt.own small{color:var(--gr)}.opt.inst{box-shadow:inset 0 -2px 0 var(--ac2)}
.lvchips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}.lvchips .opt{padding:6px 9px;font-size:13px}
.cart{margin-top:12px;border-top:1px solid var(--ln);padding-top:10px}.cart h4{margin:0 0 6px;display:flex;justify-content:space-between}.cart .ci{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:#cfd6df}.cart .ci b{color:var(--ac)}.cart .ci b.free{color:var(--gr)}
.cart .acts2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.cart .acts2 .btn{flex:1;min-width:120px}
.cart .ci{align-items:center;gap:8px}.cart .ci span{flex:1}.cx{width:26px;height:26px;border-radius:7px;border:1px solid var(--ln);background:var(--p2);color:#cfd6df;font-size:17px;line-height:1;display:grid;place-items:center;flex:none;cursor:pointer}.cx:hover{border-color:var(--rd);color:var(--rd)}
.vleft{align-self:start;position:sticky;top:calc(var(--hh,62px) + 12px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - var(--hh,62px) - 24px);overflow:auto;scrollbar-width:thin}

.cartbar{display:none}

.tsw i{flex:none;width:34px;height:20px;border-radius:12px;background:#3a414c;position:relative}.tsw i:after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#cfd6df;transition:left .15s}
.tsw.on{border-color:#ff8a3d}.tsw.on i{background:#ff8a3d}.tsw.on i:after{left:17px;background:#fff}.tsw.lock{opacity:.5}.tsw b{display:block;font-size:14px}.tsw small{color:#9aa3ae;font-weight:600;font-size:12px}.tneed{color:#ff8a3d;font-weight:700;font-size:13px;margin-top:6px}

.g3hint{position:absolute;left:10px;bottom:8px;font:600 12px Rajdhani,Arial;color:#8b95a4;pointer-events:none}
#roamUI{position:absolute;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(360px,calc(100% - 140px))}
.rbtn{padding:8px 14px;border-radius:12px;border:1px solid var(--ac);background:rgba(8,10,13,.82);color:#eef1f5;font:700 15px Rajdhani,Arial;white-space:nowrap}
.rpanel{width:100%;max-height:46vh;overflow:auto;background:rgba(10,12,15,.94);border:1px solid var(--ln);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--p2);border-radius:10px;padding:8px}.rrow b{display:block;font-size:15px}.rrow small{color:#9aa3ae;font-weight:600;font-size:12.5px}
.rmap .rmimg{height:130px;display:flex;align-items:flex-end;padding:12px;font-family:"Russo One","Arial Black",sans-serif;font-size:22px;color:#fff;text-shadow:0 2px 8px #000}
.rm-rodovia{background:linear-gradient(180deg,#26305e,#f39a63 70%,#3d5a2a 71%)}.rm-cidade{background:repeating-linear-gradient(90deg,#0c1222 0 22px,#1a2440 22px 30px),linear-gradient(#02040a,#1a2440)}.rm-encontro{background:radial-gradient(circle at 70% 30%,rgba(255,207,138,.5),transparent 40%),linear-gradient(#02040a,#23262b)}
.rivals{display:flex;flex-direction:column;gap:8px;margin-top:10px}.rv{display:flex;gap:10px;align-items:center;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:8px}.rv canvas{width:118px;height:62px;flex:none;border-radius:8px;background:#0d1014}.rv b{font-size:15px}.rv small{display:block;font-size:12.5px;font-weight:600;line-height:1.25;margin-top:2px}.rv .cls{font-size:11px}
.gift{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 16px;padding:14px 16px;border-radius:14px;border:1px solid var(--ac);background:linear-gradient(110deg,rgba(198,255,61,.16),rgba(198,255,61,.03) 60%),var(--p1)}

@media(max-width:860px){.vleft{display:contents}.vprev{position:sticky;top:var(--hh,62px);z-index:15;order:0;padding:8px 10px;box-shadow:0 10px 24px rgba(0,0,0,.55)}.vprev .stage{height:150px}.vprev h2{font-size:15px!important}.vprev .tag{font-size:12px!important}.vopts{order:1}.vcartp{order:2;scroll-margin-top:240px}}
@media(max-width:860px){.cartbar{display:flex;position:fixed;left:8px;right:8px;bottom:8px;z-index:40;background:var(--p1,#14171c);border:1px solid var(--ac);border-radius:12px;padding:8px 10px;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6)}.cartbar span{flex:1;font-weight:700;font-size:14px}.vispad{padding-bottom:80px}}
.sw{width:34px;height:34px;border-radius:8px;border:2px solid var(--ln)}
.sw.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}

.mode{padding:14px;border-radius:12px;background:var(--p1);border:1px solid var(--ln);text-align:left}

.mode b{font-family:'Russo One','Arial Black',sans-serif;font-size:18px;display:block}
.mode span{color:var(--mu);font-size:14px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac);color:#111;font-weight:700;padding:10px 18px;border-radius:10px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:opacity .3s}

input[type=range]{width:100%;accent-color:var(--ac)}

<body>

function remapMax(model,up){let m=4;if((up.motor||0)<3)m=3;if((up.turbo||0)<2)m=Math.min(m,2);if((up.motor||0)<1)m=Math.min(m,1);return m}

const R5=[.30,.48,.65,.82,1], R6=[.26,.40,.54,.68,.84,1];
const DRIVE_F={FWD:.6,RWD:.7,AWD:.92};

/* ---------- 3. FÍSICA (funções puras, testáveis fora do navegador) ---------- */
function computeSpec(model,up,o={}){
  const t=model.tune, B=BODIES[model.body];
  const rm=Math.min(up.remap||0,remapMax(model,up)),tb=model.turbo||up.turbo>0;
  const pm=(1+(PARTS.motor.vals[up.motor]-1)*t)*(1+(PARTS.remap.vals[rm]-1)*(tb?1:.45)), tm=(1+(PARTS.turbo.vals[up.turbo]-1)*t)*(tb?1+rm*.03:1);
  const s={hp:model.hp*pm*(o.hpScale||1),tm,turboStock:model.turbo,remap:rm,
    mass:model.wt*PARTS.peso.vals[up.peso]+80,grip:model.grip+PARTS.pneus.vals[up.pneus],
    handling:model.handling+PARTS.susp.vals[up.susp],shiftTime:PARTS.cambio.vals[up.cambio],
    gearsN:up.cambio>=2?6:5,nitro:PARTS.nitro.vals[up.nitro],
    spool:(model.turbo||up.turbo>0)?3.2-up.turbo*.45:99,driveF:DRIVE_F[model.drive],
    cda:B.cda,L:model.L,W:B.w};
  s.ratios=s.gearsN===6?R6:R5;if(rm>=3)s.shiftTime*=.65;
  const peak=s.hp*s.tm*745.7*.85;let lo=5,hi=150;
  for(let i=0;i<40;i++){const v=(lo+hi)/2;const need=(.6*s.cda*v*v+.015*s.mass*9.81)*v;if(need>peak)hi=v;else lo=v}
  s.vmax=lo; s.latCap=3+s.handling*7+s.grip*3;
  return s;
}
const powerCurve=rf=>clamp(1-Math.pow((rf-.8)/.75,2),.3,1);
function newRunner(spec){return{x:0,v:0,gear:1,rpm:.15,boost:0,shiftT:0,nitroLeft:spec.nitro,nitroOn:false,launchT:9,launchRpm:0,spinT:0,bogT:0,limiter:false,wheelspin:false,shifts:0,acc:0}}
function gearTop(spec,g){return spec.vmax*1.04*spec.ratios[g-1]}
function physStep(spec,r,dt,c){
  let gt=gearTop(spec,r.gear), rf=r.v/gt;
  if(r.launchT<.7){r.launchT+=dt;const k=1-r.launchT/.7;rf=Math.max(rf,r.launchRpm*k+rf*(1-k))}
  if(c.auto&&r.shiftT<=0){
    if(rf>c.auto&&r.gear<spec.gearsN){r.gear++;r.shiftT=spec.shiftTime;r.shifts++;r.justShifted=true}
    else if(rf<.42&&r.gear>1){r.gear--}
  }
  const tgt=c.throttle&&rf>.35?1:0;
  r.boost+=(tgt-r.boost)*Math.min(1,dt*spec.spool*(tgt?1:2.5));
  const tf=(spec.turboStock?.72+.28*r.boost:1)*(1+(spec.tm-1)*r.boost);
  let P=spec.hp*745.7*.85*tf*powerCurve(Math.min(rf,1))*(c.throttle?1:0)*(c.powerMul||1);
  r.nitroOn=false;
  if(c.nitro&&r.nitroLeft>0&&c.throttle){r.nitroLeft=Math.max(0,r.nitroLeft-dt);P*=1.4;r.nitroOn=true}
  r.limiter=rf>=1; if(r.limiter)P=0;
  if(r.shiftT>0){r.shiftT-=dt;P*=.05}
  let F=P/Math.max(r.v,2.5);
  let trac=spec.grip*spec.mass*9.81*spec.driveF*(c.offroad?.6:1);
  if(r.spinT>0){r.spinT-=dt;trac*=.68}
  if(r.bogT>0){r.bogT-=dt;F*=.5}
  r.wheelspin=F>trac&&r.v<25; if(F>trac)F=trac;
  const drag=.6*spec.cda*r.v*r.v+.015*spec.mass*9.81*(c.offroad?7:1);
  let a=(F-drag)/spec.mass; if(c.brake)a-=9.5;
  r.v=Math.max(0,r.v+a*dt); r.x+=r.v*dt; r.acc=a;
  r.rpm=clamp(rf,.12,1.02);
}
function simulate(spec){
  const r=newRunner(spec);r.launchT=0;r.launchRpm=.66;
  let t=0,t100=null;const dt=1/120;
  while(r.x<402&&t<40){physStep(spec,r,dt,{throttle:1,auto:.94});t+=dt;if(t100===null&&r.v>=27.78)t100=t}
  return{t100:t100||99,t402:t,vmax:spec.vmax*3.6,trap:r.v*3.6};
}
const CLASSES=[[0,'D','#9aa3ad'],[400,'C','#3db8ff'],[600,'B','#36d67a'],[800,'A','#ffd23d'],[1000,'S','#ff8a3d'],[1200,'S+','#ff4d5a']];
function classOf(pi){let c=CLASSES[0];for(const k of CLASSES)if(pi>=k[0])c=k;return{name:c[1],color:c[2]}}
const _perfCache={};
function perf(model,up,o={}){
  const key=model.id+JSON.stringify(up)+(o.hpScale||1);
  if(_perfCache[key])return _perfCache[key];
  const spec=computeSpec(model,up,o),s=simulate(spec);
  const pi=Math.round((19.5-s.t402)*120+(spec.grip+spec.handling)*60+spec.nitro*8);
  return _perfCache[key]={spec,...s,pi};
}
function makeOpponentSpec(targetPI,excludeId){
  const pool=CARS.filter(c=>c.id!==excludeId);
  const base=c=>perf(c,{motor:0,turbo:0,cambio:0,pneus:0,susp:0,peso:0,nitro:0}).pi;
  const top=c=>perf(c,{motor:4,turbo:4,cambio:4,pneus:4,susp:4,peso:4,nitro:4}).pi;
  let cand=pool.filter(c=>base(c)<=targetPI+160&&top(c)>=targetPI);
  if(!cand.length)cand=[pool.reduce((a,b)=>base(a)<base(b)?a:b)];
  const model=pick(cand);
  const lv=clamp(Math.round((targetPI-base(model))/160),0,4);
  const up={};for(const k in PARTS)up[k]=clamp(lv+Math.round(rnd(-1,1)),0,4);
  let lo=.3,hi=4;
  for(let i=0;i<14;i++){const m=(lo+hi)/2;if(perf(model,up,{hpScale:m}).pi<targetPI)lo=m;else hi=m}
  const hpScale=(lo+hi)/2;
  return{model,up,spec:computeSpec(model,up,{hpScale}),pi:perf(model,up,{hpScale}).pi};
}

function pop(r,st=1,snd=true){r.popT=.07+.08*st;r.popS=st;if(snd)Snd.pop(st)}
function initWear(sc){

  sc.health={...h};sc.dmg={motor:0,turbo:0,cambio:0};sc.heat=0;sc.broken={};sc.perfect=sc.perfect||0;
  sc.stress=1+(car.up.motor+car.up.turbo)*.1+car.up.nitro*.04+Math.max(0,m.tune-1)*.6;

function failPart(sc,k,r){
  if(sc.broken[k])return;sc.broken[k]=true;sc.dmg[k]=Math.max(sc.dmg[k],sc.health[k]);
  const sp=sc.spec;
  if(k==='motor'){sc.msg('MOTOR BATEU!','#ff4d5a');Snd.boom();sc.shake=.6;sc.blownAt=sc.t;r.boost=0}
  else if(k==='turbo'){sc.msg('TURBINA ESTOUROU!','#ff4d5a');Snd.hiss();sp.tm=1;if(sp.turboStock){sp.hp*=.72;sp.turboStock=false}sp.spool=99;r.boost=0;sc.shake=.3}

  try{navigator.vibrate&&navigator.vibrate([60,40,120])}catch(e){}
}
function wearStep(sc,r,gas,dt){
  if(!sc.dmg||sc.broken.motor)return;
  const st=sc.stress,sp=sc.spec,hasT=sp.tm>1.001||sp.turboStock;
  if(r.limiter&&gas){sc.heat+=dt*.2*st;sc.dmg.motor+=dt*1.5*st;if(hasT)sc.dmg.turbo+=dt*.7*st}
  else sc.heat-=dt*(r.rpm<.8?.09:.03);
  if(r.nitroOn){sc.heat+=dt*.05;sc.dmg.motor+=dt*.8*st;if(hasT)sc.dmg.turbo+=dt*1.1}
  if(gas&&r.rpm>.92&&!r.limiter)sc.heat+=dt*.012*st;

  if(sc.heat>.82){sc.dmg.motor+=dt*7;if(!sc.warnHeat){sc.warnHeat=1;sc.msg('SUPERAQUECENDO! ALIVIA O PÉ','#ffd23d')}}else if(sc.heat<.6)sc.warnHeat=0;
  const hm=sc.health.motor-sc.dmg.motor,ht=sc.health.turbo-sc.dmg.turbo,hc=sc.health.cambio-sc.dmg.cambio;
  if(hm<=0||(sc.heat>=.99&&Math.random()<dt*.9)||(gas&&hm<25&&Math.random()<dt*.02*(1-hm/25)))failPart(sc,'motor',r);
  else if(hasT&&!sc.broken.turbo&&(ht<=0||(gas&&r.boost>.9&&ht<20&&Math.random()<dt*.03*(1-ht/20))))failPart(sc,'turbo',r);
  if(!sc.broken.cambio&&hc<=0)failPart(sc,'cambio',r);

function doShift(sc,r,sp,dir,quiet){
  if(sc.broken&&sc.broken.cambio){if(!quiet)sc.msg('CÂMBIO QUEBRADO','#ff4d5a');return}
  if((dir>0&&r.gear>=sp.gearsN)||(dir<0&&r.gear<=1))return;
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
  if(r.shiftT>0){sc.dmg.cambio+=3;sc.msg('ARRANHOU A MARCHA!','#ffd23d');Snd.grind();return}
  const rf=r.v/gearTop(sp,r.gear);r.gear+=dir;r.shifts++;
  if(dir>0){const per=rf>=.86&&rf<.975;r.shiftT=sp.shiftTime*(per?.45:1);
    if(per){sc.perfect++;sc.msg('TROCA PERFEITA!')}else{sc.dmg.cambio+=rf>=.975?1.1:.5;if(rf<.6)sc.msg('TROCA CEDO','#ffd23d');else if(rf>=.975)sc.msg('TROCA TARDE','#ffd23d');else if(!quiet)sc.msg('BOA TROCA','#eef1f5')}

    if(nr>1.04){sc.dmg.motor+=(nr-1)*80*sc.stress;sc.dmg.cambio+=(nr-1)*25;sc.msg(nr>1.25?'SOBREGIRO FORTE!':'SOBREGIRO!','#ff4d5a');Snd.grind();if(nr>1.3&&Math.random()<.45)failPart(sc,'motor',r)}
    else if(!quiet)sc.msg('REDUZIU','#eef1f5');pop(r,.6)}
}

    const dn=e=>{e.preventDefault();Snd.init();try{b.setPointerCapture(e.pointerId)}catch(_){}Input.down(key);b.classList.add('act');if(key==='shift'||key==='down')try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}},
      upf=e=>{e.preventDefault();Input.up(key);b.classList.remove('act')};

  const w=c.querySelector('[data-wheel]');
  if(w){const svg=w.querySelector('svg');let pid=null;

}

/* ---------- 11b. SALA P2P (WebRTC via PeerJS) — mesma interface do "room" ---------- */
function makeP2PRoom(code){
  const HOST_ID='rachabr-vc-'+code;const opts=Object.assign({debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}},window.PEER_OPTS||{});
  const me=S.pid,mine={};let peer=null,isHost=false,conns=new Map(),hostConn=null,table={},alive=true,openT=0,fireT=0,connected=false;
  const cbs=[],ccbs=[];
  const snap=()=>{const a=[{peer:me,by:me,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:JSON.parse(JSON.stringify(mine)),updatedAt:Date.now()}];
    for(const id in table)if(id!==me)a.push({peer:id,by:id,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:table[id].p,updatedAt:table[id].t});return a};
  const fire=()=>{if(fireT)return;fireT=setTimeout(()=>{fireT=0;const ps=snap();cbs.forEach(f=>{try{f({peers:ps,joined:[],left:[],updated:[]})}catch(e){console.warn(e)}})},25)};
  const setConn=c=>{if(connected===c)return;connected=c;ccbs.forEach(f=>f(c))};
  const relay=(m,except)=>{for(const[c]of conns)if(c!==except&&c.open)try{c.send(m)}catch(e){}};
  const mineMsg=()=>({t:'p',id:me,p:mine});
  const onData=(c,m)=>{if(!m||typeof m!=='object')return;
    if(m.t==='p'&&typeof m.id==='string'&&m.id!==me&&m.p&&typeof m.p==='object'){if(c)c._pid=m.id;table[m.id]={p:m.p,t:Date.now()};fire();if(isHost)relay(m,c)}
    else if(m.t==='bye'&&typeof m.id==='string'){delete table[m.id];fire();if(isHost)relay(m,c)}
    else if(m.t==='all'&&!isHost&&Array.isArray(m.list)){for(const e of m.list)if(e&&e.id&&e.id!==me&&e.p)table[e.id]={p:e.p,t:Date.now()};fire()}};
  function start(){
    if(!alive)return;isHost=false;hostConn=null;conns.clear();table={};fire();
    peer=new Peer(HOST_ID,opts);
    peer.on('open',()=>{isHost=true;setConn(true);fire()});
    peer.on('connection',c=>{
      c.on('open',()=>{conns.set(c,1);try{c.send({t:'all',list:[{id:me,p:mine},...Object.entries(table).map(([id,v])=>({id,p:v.p}))]})}catch(e){}});
      c.on('data',m=>onData(c,m));
      const gone=()=>{if(!conns.has(c))return;conns.delete(c);if(c._pid){delete table[c._pid];relay({t:'bye',id:c._pid});fire()}};c.on('close',gone);c.on('error',gone)});
    peer.on('error',e=>{if(e.type==='unavailable-id'){try{peer.destroy()}catch(_){}client()}else if(isHost&&(e.type==='network'||e.type==='server-error'||e.type==='socket-error')){setConn(false);setTimeout(restart,3000)}});
    peer.on('disconnected',()=>{if(alive&&peer&&!peer.destroyed)try{peer.reconnect()}catch(_){}});
  }
  function client(){
    if(!alive)return;peer=new Peer(opts);
    peer.on('open',()=>{hostConn=peer.connect(HOST_ID,{reliable:true});clearTimeout(openT);
      openT=setTimeout(()=>{if(!hostConn||!hostConn.open){NET.netErr='Não conectou à sala. A rede pode estar bloqueando conexão direta (tente no Wi-Fi). Tentando de novo…';refreshOnline();restart()}},12000);
      hostConn.on('open',()=>{clearTimeout(openT);NET.netErr=null;setConn(true);try{hostConn.send(mineMsg())}catch(e){}});
      hostConn.on('data',m=>onData(null,m));
      hostConn.on('close',()=>{setConn(false);table={};fire();setTimeout(restart,400+Math.random()*1600)})});
    peer.on('error',e=>{if(e.type==='peer-unavailable'){setTimeout(restart,500+Math.random()*1500)}else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){setConn(false);NET.netErr='Sem conexão com o servidor de salas. Tentando de novo…';refreshOnline();setTimeout(restart,4000)}});
  }
  function restart(){clearTimeout(openT);try{peer&&peer.destroy()}catch(e){}if(alive)start()}
  addEventListener('beforeunload',()=>{try{peer&&peer.destroy()}catch(e){}});
  start();
  return{
    presence(patch){for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k]}const m=mineMsg();
      if(isHost)relay(m);else if(hostConn&&hostConn.open)try{hostConn.send(m)}catch(e){}fire();return Promise.resolve()},
    onPeers(f){cbs.push(f);fire();return()=>{}},
    onConnection(f){ccbs.push(f);setTimeout(()=>f(connected),0);return()=>{}},
    connected:()=>connected,peers:snap,
    leave(){alive=false;clearTimeout(openT);try{peer&&peer.destroy()}catch(e){}},
  };
}

const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const strHash=s=>{let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};

function cleanVis(v,model){
  const hx=/^#[0-9a-fA-F]{6}$/,v0=VIS0(model.color),o={...v0};v=v&&typeof v==='object'?v:{};
  for(const k of['color','wheelColor','stripeColor','neonColor'])if(hx.test(v[k]))o[k]=v[k];
  for(const k of VCATS)o[k]=clamp(Math.floor(+v[k]||0),0,vMax(k));return o;
}

    return false;
  },
  watch(scene,dt){const n=scene.net;if(this.peer(n.peer)){n.lost=0;return}n.lost+=dt;if(n.lost>4&&!n.left){n.left=true;scene.msg&&scene.msg('SEU AMIGO SAIU','#ffd23d')}},
  end(){this.set({rc:null,st:'idle',acc:null,inv:null});this.pushLobby()},
  // ranking compartilhado
  subRank(){
    try{this.db.collection('rank').onSnapshot(s=>{this.rank=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));const ids=this.rank.map(r=>r.id);this.resolveNames(ids);refreshOnline()},()=>{})}catch(e){}
  },
  row(nick,lvl,car,pi,st){return{nick:String(nick||'Piloto').slice(0,24),lvl:lvl|0,car:CAR[car]?car:'chevette',pi:pi|0,wins:st.wins|0,races:st.races|0,best:typeof st.best==='number'?Math.round(st.best*1000)/1000:null,ow:st.ow|0,ol:st.ol|0}},
  async write(id,row){if(this.mode==='p2p'){if(id!==this.myId)return;const k=JSON.stringify(row);if(this.lastRank[id]===k)return;this.lastRank[id]=k;this.postRank(row);return}
    if(!this.db||!id)return;const k=JSON.stringify(row);if(this.lastRank[id]===k)return;this.lastRank[id]=k;try{await this.db.doc('rank/'+id).set({...row,ts:Date.now()})}catch(e){}},
  saveRank(){if(!this.myId)return;const c=activeCar();this.write(this.myId,this.row(S.settings.nick,S.level,c.model,perf(CAR[c.model],c.up).pi,myStats()))},
  ownerRank(os){if(this.mode==='p2p')return;for(const p of os){if(!p.by)continue;const pr=p.presence;this.write(p.by,this.row(pr.nick,pr.lvl,pr.car.m,pr.car.pi,pr.stt||{}))}},
};
let netRefreshT=0;
function refreshOnline(){
  const dot=document.querySelector('nav [data-v=online]');
  if(dot){const has=NET.others().some(p=>p.presence.inv&&p.presence.inv.to===NET.myPeer);dot.innerHTML='Online'+(NET.others().length?` <span style="opacity:.7">(${NET.others().length})</span>`:'')+(has?'<span class="dot"></span>':'')}
  if(TAB!=='online'||Game.scene)return;
  clearTimeout(netRefreshT);netRefreshT=setTimeout(()=>{const el=document.getElementById('netLive');if(el){el.innerHTML=netLiveHTML();bindNetCanvases()}},60);
}
function netLiveHTML(){
  if(NET.mode==='p2p'&&!NET.room){
    return`<div class="grid g2"><div class="panel"><h2 style="font-size:18px">Criar a sala da galera</h2><p class="sub">Cria um código e um link. Manda no grupo do WhatsApp: quem abrir o link cai direto na sua sala. A sala fica salva, então da próxima vez todo mundo já entra nela.</p><button class="btn pri" data-act="roomcreate">Criar sala</button></div>
      <div class="panel"><h2 style="font-size:18px">Entrar com código</h2><p class="sub">Recebeu um código de um amigo? Digite aqui.</p><div style="display:flex;gap:8px"><input id="roomCode" maxlength="12" placeholder="ex: k7p2qz" style="flex:1;min-width:0;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;font:inherit;font-weight:700;text-transform:lowercase"><button class="btn" data-act="roomjoin">Entrar</button></div></div></div>`+rankHTML();
  }
  if(!NET.room){
    return`<div class="panel"><h2 style="font-size:18px">Online indisponível nesta tela</h2><p class="sub" style="margin:6px 0 0">O modo com amigos funciona quando o jogo é aberto pelo link do claude.ai, com sessão iniciada. Compartilhe o jogo pelo botão de compartilhar da página e peça para seus amigos abrirem pelo link. Enquanto isso, o jogo solo continua normal.</p></div>`+rankHTML();
  }
  const os=NET.others();
  const list=os.length?os.map(p=>{const pr=p.presence,m=CAR[pr.car.m],busy=pr.st==='race';
    return`<div class="ev"><div style="display:flex;gap:12px;align-items:center"><canvas data-netpeer="${p.peer}" style="width:150px;height:62px;border-radius:8px;background:#0d1014;flex:none"></canvas>
      <div style="min-width:0"><h3 data-netname="${p.peer}"></h3><div class="pl">${m.name} · PI ${pr.car.pi|0} · Nível ${pr.lvl|0}${p.guest?' · convidado':''}</div><div class="pl" style="color:${busy?'var(--ac2)':'var(--gr)'}">${busy?'Correndo agora':'Na garagem'}</div></div></div>
      <div style="display:flex;justify-content:flex-end"><button class="btn sm pri" ${busy||NET.myInv?'disabled':''} data-act="netch" data-v="${p.peer}">Desafiar</button></div></div>`}).join('')
    :`<div class="empty panel">Nenhum amigo na sala agora.<br>${NET.mode==='p2p'?'Mande o link da sala para a galera. Quem abrir aparece aqui na hora.':'Quando alguém abrir pelo link compartilhado, aparece aqui na hora.'}</div>`;
  const share=NET.mode==='p2p'?`<div class="panel" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><div style="flex:1;min-width:200px"><div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mu);font-weight:700">Sala ${NET.roomCode}</div><div style="font-weight:700;word-break:break-all" id="roomLink"></div></div>
     <button class="btn sm pri" data-act="roomshare">Convidar</button><a class="btn sm" id="waLink" target="_blank" rel="noopener">WhatsApp</a><button class="btn sm" data-act="roomcopy">Copiar link</button><button class="btn sm warn" data-act="roomleave">Sair da sala</button></div>`+(NET.netErr?`<p class="sub" style="color:var(--ac2)">${NET.netErr}</p>`:''):'';
  return share+`<div class="sub" style="display:flex;align-items:center;gap:8px"><span style="width:9px;height:9px;border-radius:50%;background:${NET.connected?'var(--gr)':'var(--ac2)'};display:inline-block"></span>${NET.connected?'Conectado':'Conectando…'} · ${os.length} amigo${os.length===1?'':'s'} online</div>
    <div class="grid g3">${list}</div>`+rankHTML();
}
function rankHTML(){
  const rows=NET.rank.slice().sort((a,b)=>(b.ow|0)-(a.ow|0)||(b.wins|0)-(a.wins|0)||((a.best||99)-(b.best||99)));
  if(!NET.db&&NET.mode!=='p2p')return'';
  return`<h2 style="font-size:18px;margin-top:22px">Ranking da galera</h2><p class="sub">Vitórias online primeiro, depois vitórias no total e melhor tempo nos 402 m.</p>
   <div class="panel" style="padding:0;overflow:auto">${rows.length?`<table style="width:100%;border-collapse:collapse;font-weight:600">
   <tr style="color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.6px;text-align:left"><th style="padding:10px 14px">#</th><th>Piloto</th><th>Nível</th><th>Online V/D</th><th>Vitórias</th><th>Melhor 402m</th><th>Carro</th></tr>
   ${rows.map((r,i)=>`<tr style="border-top:1px solid var(--ln)${r.id===NET.myId?';background:rgba(198,255,61,.06)':''}"><td style="padding:10px 14px;font-family:'Russo One','Arial Black',sans-serif;color:${i<3?'var(--ac2)':'var(--mu)'}">${i+1}</td><td data-rankname="${r.id}"></td><td>${r.lvl|0}</td><td>${r.ow|0} / ${r.ol|0}</td><td>${r.wins|0}</td><td>${r.best?(+r.best).toFixed(2)+'s':'—'}</td><td>${CAR[r.car]?CAR[r.car].name:'—'} <span style="color:var(--mu)">· ${r.pi|0}</span></td></tr>`).join('')}</table>`:'<div class="empty">Ninguém no ranking ainda. Termine uma corrida para entrar.</div>'}</div>`;
}
function bindNetCanvases(){
  const rl=document.getElementById('roomLink');if(rl&&NET.roomCode){rl.textContent=NET.roomLink();const wa=document.getElementById('waLink');if(wa)wa.href='https://wa.me/?text='+encodeURIComponent('Bora um racha? Entra na minha sala do Racha BR: '+NET.roomLink())}
  document.querySelectorAll('[data-netname]').forEach(el=>{el.textContent=NET.nameOf(NET.peer(el.dataset.netname))});
  document.querySelectorAll('[data-rankname]').forEach(el=>{const r=NET.rank.find(x=>x.id===el.dataset.rankname);el.textContent=(NET.names[el.dataset.rankname]||(r&&r.nick)||'Piloto')+(el.dataset.rankname===NET.myId?' (você)':'')});
  document.querySelectorAll('canvas[data-netpeer]').forEach(cv=>{const p=NET.peer(cv.dataset.netpeer);if(!p)return;const m=CAR[p.presence.car.m];drawPreview(cv,m,cleanVis(p.presence.car.vis,m),true)});
}
function vRodagem(m){const car=activeCar(),md=CAR[car.model];
  const card=(k,btns)=>`<div class="card rmap"><div class="rmimg rm-${k}"><b>${ROAM_MAPS[k].n}</b></div><div class="cb"><p>${ROAM_MAPS[k].d}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${btns}</div></div></div>`;
  m.innerHTML=`<h2>Rodagem</h2><p class="sub">Mapas abertos pra rodar à vontade com o <b>${md.name}</b>. Todo mundo que entra no mesmo mapa se vê ao vivo, e dá pra chamar qualquer um pra uma arrancada de 402 m.</p>
  <div class="grid g3">${card('rodovia',`<button class="btn pri" data-act="roam" data-v="rodovia" data-t="1">Com trânsito</button><button class="btn" data-act="roam" data-v="rodovia" data-t="0">Sem trânsito</button>`)}
  ${card('cidade',`<button class="btn pri" data-act="roam" data-v="cidade" data-t="1">Entrar</button><button class="btn" data-act="roam" data-v="cidade" data-t="0">Ruas vazias</button>`)}
  ${card('encontro',`<button class="btn pri" data-act="roam" data-v="encontro" data-t="0">Entrar no encontro</button>`)}</div>
  <p class="sub" style="margin-top:14px">Dentro do mapa, toque em <b>👥 pilotos</b> para ver quem está lá e desafiar. Ao terminar a arrancada você volta pro mapa. O trânsito é só seu e os outros pilotos não batem em você.</p>`}
function vOnline(m){
  m.innerHTML=`<h2>Online com amigos</h2><p class="sub">Corrida ao vivo contra os amigos: cada um no próprio celular ou computador, com o próprio carro, e vocês se veem na pista.</p>
   <div class="panel" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><span style="font-weight:700">Seu apelido</span><input id="nick" maxlength="20" value="" style="flex:1;min-width:160px;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;font:inherit;font-weight:600"><button class="btn sm" data-act="nicksave">Salvar</button></div>
   <div id="netLive"></div>`;
  $('#nick').value=S.settings.nick||'';
  $('#netLive').innerHTML=netLiveHTML();bindNetCanvases();
}
function openChallenge(peerId){
  const p=NET.peer(peerId);if(!p)return;const max=Math.min(S.money,20000);
  modal(`<h2>Desafiar <span id="chName"></span></h2><p class="sub">Escolha o modo. A aposta sai do seu dinheiro e do dele; quem ganhar leva tudo.</p>
   <div class="modes" style="grid-template-columns:1fr 1fr"><button class="mode on" data-act="chmode" data-v="racha"><b>Racha</b><span>1 contra 1 no trânsito</span></button><button class="mode" data-act="chmode" data-v="drag"><b>Arrancada</b><span>402 m lado a lado</span></button></div>
   <div style="display:flex;justify-content:space-between;font-weight:700"><span>Aposta</span><span id="chBetV">${fmt(0)}</span></div><input type="range" id="chBet" min="0" max="${max}" step="${Math.max(50,Math.round(max/20/50)*50)}" value="0">
   <div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="chsend" data-v="${peerId}">Enviar desafio</button></div>`);
  $('#chName').textContent=NET.nameOf(p);const b=$('#chBet');b.addEventListener('input',()=>$('#chBetV').textContent=fmt(+b.value));
}

function netWaitHUD(ctx,W,H,n){ctx.fillStyle='rgba(8,10,13,.82)';const tw=Math.min(520,W-30);ctx.fillRect((W-tw)/2,H*.32,tw,92);ctx.textAlign='center';
  ctx.fillStyle='#ffd23d';ctx.font='22px "Russo One","Arial Black",sans-serif';ctx.fillText('AGUARDANDO SEU AMIGO',W/2,H*.32+38);
  ctx.fillStyle='#eef1f5';ctx.font='700 16px Rajdhani,Arial,sans-serif';ctx.fillText(n.oppName+' está carregando a pista…',W/2,H*.32+66)}
if(/^#sala-/i.test(location.hash))TAB='online';
if(/resgat|presente|gift/i.test(location.hash+location.search)&&!S.gift80)TAB='loja';
render();
if(!S.gift80&&!/^#sala-/i.test(location.hash))setTimeout(giftModal,500);
NET.init();
try{if(window.THREE&&THREE.GLTFLoader)S.cars.forEach(c=>{const m=CAR[c.model];m&&m.glb&&loadGLB(m.glb)})}catch(e){}
if(S.daily.last!==today()&&S.stats.races>0)setTimeout(()=>toast('Bônus diário disponível em Patrocínios'),800);
</script>
