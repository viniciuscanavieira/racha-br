<style>

*{box-sizing:border-box;margin:0;padding:0}

function makeOpponentSpec(targetPI,excludeId){
  const pool=CARS.filter(c=>c.id!==excludeId);
  const base=c=>perf(c,{motor:0,turbo:0,cambio:0,pneus:0,susp:0,peso:0,nitro:0}).pi;
  const top=c=>perf(c,{motor:4,turbo:4,cambio:4,pneus:4,susp:4,peso:4,nitro:4}).pi;
  let cand=pool.filter(c=>base(c)<=targetPI+160&&top(c)>=targetPI);
  if(!cand.length)cand=[pool.reduce((a,b)=>base(a)<base(b)?a:b)];
  const model=pick(cand);
  const lv=clamp(Math.round((targetPI-base(model))/160),0,4);
  const up={};for(const k in PARTS)up[k]=clamp(lv+Math.round(rnd(-1,1)),0,4);

  for(let i=0;i<14;i++){const m=(lo+hi)/2;if(perf(model,up,{hpScale:m}).pi<targetPI)lo=m;else hi=m}

  return{model,up,spec:computeSpec(model,up,{hpScale}),pi:perf(model,up,{hpScale}).pi};
}

  const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);

}

    const net={group:true,code:g.c,seed,host:myIdx===0,myIdx,peers,peer:peers[0].peer,oppName:peers.map(e=>e.name).join(', '),oppModel:peers[0].model,oppVis:peers[0].vis,oppPi:peers[0].pi,go:false,lost:0};
    closeModal();TAB='online';Game.start(ev,0,net);this.set({st:'race',inv:null,gj:null})},
  grpTick(os){
    if(this.grp&&!this.grp.go){const mem=os.filter(p=>p.presence.gj&&p.presence.gj.c===this.grp.c&&p.presence.st!=='race').map(p=>p.peer).slice(0,3);if(JSON.stringify(mem)!==JSON.stringify(this.grp.mem)){this.grp.mem=mem;this.set({grp:{...this.grp}})}}
    if(this.gj){const h=this.peer(this.gj.h),g=h&&h.presence.grp;
      if(!g||g.c!==this.gj.c){this.gj=null;this.set({gj:null});if(!Game.scene)toast('O criador cancelou a corrida em grupo')}
      else if(g.go&&Array.isArray(g.list)&&g.list.includes(this.myPeer)&&!this.shown[g.c]){this.shown[g.c]=1;this.gj=null;if(!Game.scene||Game.scene.mode==='roam'){if(Game.scene)Game.leave();this.startGroup(g)}}}},
  // ranking compartilhado
  subRank(){
    try{this.db.collection('rank').onSnapshot(s=>{this.rank=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));const ids=this.rank.map(r=>r.id);this.resolveNames(ids);refreshOnline()},()=>{})}catch(e){}
  },
  row(nick,lvl,car,pi,st){return{nick:String(nick||'Piloto').slice(0,24),lvl:lvl|0,car:CAR[car]?car:'chevette',pi:pi|0,wins:st.wins|0,races:st.races|0,best:typeof st.best==='number'?Math.round(st.best*1000)/1000:null,ow:st.ow|0,ol:st.ol|0}},
  async write(id,row){if(this.mode==='p2p'){if(id!==this.myId)return;const k=JSON.stringify(row);if(this.lastRank[id]===k)return;this.lastRank[id]=k;this.postRank(row);return}
    if(!this.db||!id)return;const k=JSON.stringify(row);if(this.lastRank[id]===k)return;this.lastRank[id]=k;try{await this.db.doc('rank/'+id).set({...row,ts:Date.now()})}catch(e){}},
  saveRank(){if(!this.myId)return;const c=activeCar();this.write(this.myId,this.row(S.settings.nick,S.level,c.model,perf(CAR[c.model],c.up).pi,myStats()))},
  ownerRank(os){if(this.mode==='p2p')return;for(const p of os){if(!p.by)continue;const pr=p.presence;this.write(p.by,this.row(pr.nick,pr.lvl,pr.car.m,pr.car.pi,pr.stt||{}))}},
};
let netRefreshT=0;
const PUB_ROOM='publico';
function refreshOnline(){
  const dot=document.querySelector('nav [data-v=online]');
  if(dot){const has=NET.others().some(p=>p.presence.inv&&p.presence.inv.to===NET.myPeer);dot.innerHTML=(guestLocked()?'🔒 ':'')+'Online'+(NET.others().length?` <span style="opacity:.7">(${NET.others().length})</span>`:'')+(has?'<span class="dot"></span>':'')}
  if(TAB!=='online'||Game.scene)return;
  clearTimeout(netRefreshT);netRefreshT=setTimeout(()=>{const el=document.getElementById('netLive');if(el){el.innerHTML=netLiveHTML();bindNetCanvases()}},60);
}

      <div class="panel"><h2 style="font-size:18px">Entrar com código</h2><p class="sub">Recebeu um código de um amigo? Digite aqui.</p><div style="display:flex;gap:8px"><input id="roomCode" maxlength="12" placeholder="ex: k7p2qz" style="flex:1;min-width:0;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;font:inherit;font-weight:700;text-transform:lowercase"><button class="btn" data-act="roomjoin">Entrar</button></div></div></div>`+rankHTML();

      <div style="min-width:0"><h3 data-netname="${p.peer}"></h3><div class="pl">${m.name} · PI ${pr.car.pi|0} · Nível ${pr.lvl|0}${p.guest?' · convidado':''}</div><div class="pl" style="color:${busy?'var(--ac2)':'var(--gr)'}">● ${busy?'Correndo agora':'Online · disponível'}</div></div></div>
      <div style="display:flex;justify-content:flex-end"><button class="btn sm pri" ${busy||NET.myInv?'disabled':''} data-act="netch" data-v="${p.peer}">Desafiar</button></div></div>`}).join('')
    :pub?`<div class="empty panel">Ninguém online agora.<br>Assim que outro piloto abrir o jogo, ele aparece aqui na hora. Chame a galera pelo WhatsApp!</div>`:`<div class="empty panel">Nenhum amigo na sala agora.<br>${NET.mode==='p2p'?'Mande o link da sala para a galera. Quem abrir aparece aqui na hora.':'Quando alguém abrir pelo link compartilhado, aparece aqui na hora.'}</div>`;
  const share=pub?`<div class="panel" style="margin-bottom:12px"><h2 style="font-size:18px;margin:0 0 4px">🌐 Jogadores online agora</h2><p class="sub" style="margin:0 0 10px">Todo mundo que está com o jogo aberto aparece aqui em tempo real. Toque em Desafiar para chamar alguém para um racha.</p>
     <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn sm" data-act="roomcreate">Criar sala privada</button><input id="roomCode" maxlength="12" placeholder="código da sala" style="width:150px;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;font:inherit;font-weight:700;text-transform:lowercase"><button class="btn sm" data-act="roomjoin">Entrar</button></div></div>`+(NET.netErr?`<p class="sub" style="color:var(--ac2)">${NET.netErr}</p>`:''):NET.mode==='p2p'?`<div class="panel" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><div style="flex:1;min-width:200px"><div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mu);font-weight:700">Sala ${NET.roomCode}</div><div style="font-weight:700;word-break:break-all" id="roomLink"></div></div>
     <button class="btn sm pri" data-act="roomshare">Convidar</button><a class="btn sm" id="waLink" target="_blank" rel="noopener">WhatsApp</a><button class="btn sm" data-act="roomcopy">Copiar link</button><button class="btn sm warn" data-act="roomleave">Sair da sala</button><span class="sub" style="width:100%;margin:0">Sala privada · ao sair você volta para a lista de jogadores online.</span></div>`+(NET.netErr?`<p class="sub" style="color:var(--ac2)">${NET.netErr}</p>`:''):'';

    <details class="sub" style="margin:4px 0 10px"><summary style="cursor:pointer">Diagnóstico da conexão</summary><div style="font-family:monospace;font-size:12px;line-height:1.6;margin-top:6px">papel: ${NETDIAG.role} · TURN carregado: ${ICE_EXTRA.length?'sim ('+ICE_EXTRA.length+')':'NÃO'} · candidato relay: ${NETDIAG.relayCand?'sim':'não'}<br>ICE: ${NETDIAG.ice} · via: ${NETDIAG.via||'—'} · falhas: ${NETDIAG.fails} · trocas de anfitrião: ${NETDIAG.swaps}<br>último erro: ${NETDIAG.err||'—'} · sala: ${NET.roomCode||'—'}<br>${NETDIAG.log.slice(-8).map(escapeHtml).join('<br>')}</div><button class="btn sm" data-act="netretry" style="margin-top:6px">Reconectar</button></details>
    <div class="grid g3" style="margin-bottom:14px">${list}</div>`+grpHTML(os)+rankHTML();
}
function grpHTML(os){
  const row=(name,car,st,col)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--ln)"><div style="min-width:0"><b>${escapeHtml(name)}</b><div class="pl">${car}</div></div><b style="color:${col};white-space:nowrap">${st}</b></div>`;
  const me=activeCar(),myCar=`${CAR[me.model].name} · PI ${perf(CAR[me.model],me.up).pi}`;
  const head=`<h2 style="font-size:18px;margin:0 0 4px">🚦 Racha no trânsito em grupo</h2><p class="sub" style="margin:0 0 10px">Até 4 pilotos na mesma pista. Todo mundo clica em Pronto e o criador da corrida larga.</p>`;
  let body='';
  if(NET.grp){const ms=NET.grpMembers(),allRd=ms.length&&ms.every(p=>p.presence.gj&&p.presence.gj.rd);
    body=row((S.settings.nick||'Você')+' (criador)',myCar,'PRONTO','var(--gr)')+ms.map(p=>{const rd=p.presence.gj&&p.presence.gj.rd,c=CAR[p.presence.car.m];return row(NET.nameOf(p),`${c?c.name:''} · PI ${p.presence.car.pi|0}`,rd?'PRONTO':'ESPERANDO',rd?'var(--gr)':'var(--ac2)')}).join('')+
      `<p class="sub" style="margin:8px 0 0">${ms.length+1}/4 pilotos${ms.length?'':' · espere a galera entrar'}</p><div class="acts"><button class="btn warn" data-act="grpcancel">Cancelar</button><button class="btn pri" data-act="grpstart" ${allRd?'':'disabled'}>Começar</button></div>`}
  else if(NET.gj){const h=NET.peer(NET.gj.h),g=h&&h.presence.grp;if(g){const ids=g.mem||[],hc=CAR[h.presence.car.m];
    body=row(NET.nameOf(h)+' (criador)',`${hc?hc.name:''} · PI ${h.presence.car.pi|0}`,'PRONTO','var(--gr)')+ids.map(id=>{if(id===NET.myPeer)return row((S.settings.nick||'Você')+' (você)',myCar,NET.gj.rd?'PRONTO':'ESPERANDO',NET.gj.rd?'var(--gr)':'var(--ac2)');const p=NET.peer(id);if(!p)return'';const rd=p.presence.gj&&p.presence.gj.rd,c=CAR[p.presence.car.m];return row(NET.nameOf(p),`${c?c.name:''} · PI ${p.presence.car.pi|0}`,rd?'PRONTO':'ESPERANDO',rd?'var(--gr)':'var(--ac2)')}).join('')+
      (ids.includes(NET.myPeer)?'':'<p class="sub" style="margin:8px 0 0">Entrando na corrida…</p>')+`<p class="sub" style="margin:8px 0 0">${ids.length+1}/4 pilotos · o criador larga quando todos estiverem prontos</p><div class="acts"><button class="btn" data-act="grpleave">Sair</button><button class="btn ${NET.gj.rd?'':'pri'}" data-act="grpready">${NET.gj.rd?'Não estou pronto':'Pronto'}</button></div>`}}
  else{const open=os.filter(p=>p.presence.grp&&!p.presence.grp.go&&p.presence.st!=='race');
    body=(open.length?open.map(p=>{const n=(p.presence.grp.mem||[]).length+1,c=CAR[p.presence.car.m];return`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--ln)"><div style="min-width:0"><b>Corrida de ${escapeHtml(NET.nameOf(p))}</b><div class="pl">${n}/4 pilotos · ${c?c.name:''}</div></div><button class="btn sm pri" data-act="grpjoin" data-v="${p.peer}" ${n>=4?'disabled':''}>${n>=4?'Cheia':'Entrar'}</button></div>`}).join(''):'')+
      `<div class="acts" style="justify-content:flex-start"><button class="btn pri" data-act="grpnew">Criar corrida em grupo</button></div>`}
  return`<div class="panel" style="margin-bottom:12px">${head}${body}</div>`;
}
function rankHTML(){
  const rows=NET.rank.slice().sort((a,b)=>(b.ow|0)-(a.ow|0)||(b.wins|0)-(a.wins|0)||((a.best||99)-(b.best||99)));
  if(!NET.db&&NET.mode!=='p2p')return'';
  return`<h2 style="font-size:18px;margin-top:22px">Ranking da galera</h2><p class="sub">Vitórias online primeiro, depois vitórias no total e melhor tempo nos 402 m.</p>
   <div class="panel" style="padding:0;overflow:auto">${rows.length?`<table style="width:100%;border-collapse:collapse;font-weight:600">
   <tr style="color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.6px;text-align:left"><th style="padding:10px 14px">#</th><th>Piloto</th><th>Nível</th><th>Online V/D</th><th>Vitórias</th><th>Melhor 402m</th><th>Carro</th></tr>
   ${rows.map((r,i)=>`<tr style="border-top:1px solid var(--ln)${r.id===NET.myId?';background:rgba(198,255,61,.06)':''}"><td style="padding:10px 14px;font-family:'Russo One','Arial Black',sans-serif;color:${i<3?'var(--ac2)':'var(--mu)'}">${i+1}</td><td data-rankname="${r.id}"></td><td>${r.lvl|0}</td><td>${r.ow|0} / ${r.ol|0}</td><td>${r.wins|0}</td><td>${r.best?(+r.best).toFixed(2)+'s':'—'}</td><td>${CAR[r.car]?CAR[r.car].name:'—'} <span style="color:var(--mu)">· ${r.pi|0}</span></td></tr>`).join('')}</table>`:'<div class="empty">Ninguém no ranking ainda. Termine uma corrida para entrar.</div>'}</div>`;
}

  const rl=document.getElementById('roomLink');if(rl&&NET.roomCode){rl.textContent=NET.roomLink();const wa=document.getElementById('waLink');if(wa)wa.href='https://wa.me/?text='+encodeURIComponent('Bora um racha? Entra na minha sala do Racha BR: '+NET.roomLink())}
  document.querySelectorAll('[data-netname]').forEach(el=>{el.textContent=NET.nameOf(NET.peer(el.dataset.netname))});
  document.querySelectorAll('[data-rankname]').forEach(el=>{const r=NET.rank.find(x=>x.id===el.dataset.rankname);el.textContent=(NET.names[el.dataset.rankname]||(r&&r.nick)||'Piloto')+(el.dataset.rankname===NET.myId?' (você)':'')});
  document.querySelectorAll('canvas[data-netpeer]').forEach(cv=>{const p=NET.peer(cv.dataset.netpeer);if(!p)return;const m=CAR[p.presence.car.m];drawPreview(cv,m,cleanVis(p.presence.car.vis,m),true)});
}

if(/^#sala-/i.test(location.hash))TAB='online';
{const mr=/[?&#]ref=([a-z0-9]{10,24})/i.exec(location.search+location.hash);if(mr){const r=mr[1].toLowerCase();if(FRESH&&r!==S.pid&&!S.refBy){S.refBy=r;S.refRep=0;save()}try{history.replaceState(null,'',location.pathname+location.hash.replace(/[#&]?ref=[a-z0-9]+/i,''))}catch(e){}}}
setTimeout(()=>{REF.report();REF.check()},2500);setInterval(()=>{if(!Game.scene)REF.check()},180000);

setTimeout(()=>{if((S.orders||[]).some(o=>!o.done&&Date.now()-o.ts<36e5))payCheck(true)},4000);
