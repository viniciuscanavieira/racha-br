<style>
:root{--bg:#0a0c0f;--p1:#12161b;--p2:#191e25;--p3:#222831;--ln:#2a313b;--tx:#eef1f5;--mu:#8b95a4;--ac:#c6ff3d;--ac2:#ffd23d;--rd:#ff4d5a;--bl:#3db8ff;--gr:#36d67a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Rajdhani,system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 600px at 80% -10%,#1b2a12 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#2a1a08 0%,transparent 60%),var(--bg);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ff{font-family:'Russo One','Arial Black',sans-serif,sans-serif;letter-spacing:.5px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(10,12,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.logo{font-family:'Russo One','Arial Black',sans-serif;font-size:24px;line-height:1;white-space:nowrap}
.logo b{color:var(--ac)}.logo i{font-style:normal;color:var(--ac2)}
.hstats{margin-left:auto;display:flex;align-items:center;gap:14px}
.money{font-family:'Russo One','Arial Black',sans-serif;font-size:20px;color:var(--ac)}
.lvl{display:flex;align-items:center;gap:8px}
.lvl .badge{font-family:'Russo One','Arial Black',sans-serif;background:var(--ac2);color:#111;border-radius:6px;padding:2px 8px;font-size:14px}
.xpbar{width:110px;height:6px;background:var(--p3);border-radius:4px;overflow:hidden}
.xpbar div{height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}
.icbtn{width:36px;height:36px;border-radius:8px;background:var(--p2);border:1px solid var(--ln);display:grid;place-items:center;font-size:16px}
nav{display:flex;gap:4px;padding:8px 18px;overflow-x:auto;border-bottom:1px solid var(--ln);background:rgba(18,22,27,.7);scrollbar-width:none}
nav button{padding:8px 14px;border-radius:8px;font-weight:700;font-size:15px;color:var(--mu);white-space:nowrap;text-transform:uppercase;letter-spacing:.6px}
nav button.on{background:var(--ac);color:#111}
nav button:not(.on):hover{background:var(--p2);color:var(--tx)}
nav .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rd);margin-left:6px;vertical-align:middle}
main{max-width:1240px;margin:0 auto;padding:18px}
h2{font-family:'Russo One','Arial Black',sans-serif;font-size:22px;margin-bottom:4px}
.sub{color:var(--mu);font-size:15px;margin-bottom:14px}
.panel{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.4fr 1fr}
.g3{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
@media(max-width:860px){.g2{grid-template-columns:1fr}.xpbar{width:60px}.logo{font-size:19px}header{padding:8px 12px;gap:8px}main{padding:12px}nav{padding:6px 12px}}
.stage{width:100%;height:300px;display:block;border-radius:12px;background:#0d1014}

.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:3px 8px;border-radius:5px;background:var(--p3);color:var(--mu)}
.tag.a{background:rgba(198,255,61,.12);color:var(--ac)}
.cls{font-family:'Russo One','Arial Black',sans-serif;display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:3px 9px;font-size:14px;color:#111}
.statrow{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:10px;margin:7px 0;font-weight:600}
.statrow .bar{height:8px;background:var(--p3);border-radius:5px;overflow:hidden;position:relative}

.statrow b{text-align:right;font-family:'Russo One','Arial Black',sans-serif;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--p2);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-family:'Russo One','Arial Black',sans-serif;font-size:20px}
.kpi small{color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;font-size:15px;background:var(--p3);border:1px solid var(--ln)}

.owned{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.ocar{min-width:150px;background:var(--p2);border:2px solid transparent;border-radius:12px;padding:8px;text-align:left}
.ocar.on{border-color:var(--ac)}

.pips{display:flex;gap:4px;margin-top:6px}

.price{white-space:nowrap;font-family:'Russo One','Arial Black',sans-serif;color:var(--ac);font-size:18px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px;color:var(--mu)}

.opt small{color:var(--mu);font-weight:600;margin-left:4px}
.sw{width:34px;height:34px;border-radius:8px;border:2px solid var(--ln)}
.sw.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}

.mode b{font-family:'Russo One','Arial Black',sans-serif;font-size:18px;display:block}
.mode span{color:var(--mu);font-size:14px}
.ev{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.ev h3{font-family:'Russo One','Arial Black',sans-serif;font-size:18px}
.ev .pl{color:var(--mu);font-size:14px}
.ev .vals{display:flex;gap:14px;font-size:14px;color:var(--mu)}
.ev .vals b{color:var(--tx);display:block;font-size:16px}
.ev.lock{opacity:.5}

.modal{background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:20px;width:min(520px,100%);max-height:92vh;overflow:auto}

.tgl button::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:.2s}
.tgl button.on{background:var(--ac)}
.tgl button.on::after{left:25px;background:#111}
#race{position:fixed;inset:0;z-index:50;background:#000;display:none;touch-action:none;user-select:none;-webkit-user-select:none}
#race canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctl{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:14px;pointer-events:none}
.ctl .gp{display:flex;gap:10px;pointer-events:auto}
.tb{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);font-family:'Russo One','Arial Black',sans-serif;font-size:13px;color:#fff;display:grid;place-items:center;touch-action:none;text-align:center;line-height:1.05}
.tb.big{width:96px;height:96px}
.tb.g{border-color:var(--ac);color:var(--ac)}
.tb.n{border-color:var(--bl);color:var(--bl)}
.tb.r{border-color:var(--rd);color:var(--rd)}
.tb.y{border-color:var(--ac2);color:var(--ac2)}
.tb.act{background:rgba(255,255,255,.3)}
.pausebtn{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:10px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25);color:#fff;font-family:'Russo One','Arial Black',sans-serif;z-index:2}
.keys{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.45);font-size:13px;font-weight:600;pointer-events:none;text-align:center}
@media (hover:none){.keys{display:none}}
.empty{color:var(--mu);padding:20px;text-align:center}
.tb{transition:background .1s,transform .05s}
.ctl .gp{align-items:flex-end}.ctl .gp.col,.ctl .col{display:flex;flex-direction:column;gap:10px;align-items:center}
.tb{border-radius:22px;backdrop-filter:blur(4px);background:rgba(10,12,16,.45);box-shadow:0 6px 18px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none}

.tb.sm{width:70px;height:58px;font-size:15px}.tb.md{width:84px;height:70px}.tb.lg{width:92px;height:92px;font-size:26px;border-radius:50%}.tb.xl{width:120px;height:120px;font-size:16px;border-radius:50%}
.tb.act{transform:scale(.94);background:rgba(255,255,255,.28)}
@media(max-width:700px){.tb.sm{width:60px;height:50px;font-size:13px}.tb.md{width:70px;height:60px;font-size:12px}.tb.lg{width:78px;height:78px}.tb.xl{width:96px;height:96px;font-size:13px}}
@media(max-width:520px){.tb{width:62px;height:62px;font-size:11px}.tb.big{width:74px;height:74px}.ctl{padding:10px}.ctl .gp{gap:8px}}
a.btn{text-decoration:none;color:var(--tx)}
.foot{color:var(--mu);font-size:13px;text-align:center;padding:24px 0 10px}
</style>
</head>

function computeSpec(model,up,o={}){
  const t=model.tune, B=BODIES[model.body];
  const pm=1+(PARTS.motor.vals[up.motor]-1)*t, tm=1+(PARTS.turbo.vals[up.turbo]-1)*t;
  const s={hp:model.hp*pm*(o.hpScale||1),tm,turboStock:model.turbo,
    mass:model.wt*PARTS.peso.vals[up.peso]+80,grip:model.grip+PARTS.pneus.vals[up.pneus],
    handling:model.handling+PARTS.susp.vals[up.susp],shiftTime:PARTS.cambio.vals[up.cambio],
    gearsN:up.cambio>=2?6:5,nitro:PARTS.nitro.vals[up.nitro],
    spool:(model.turbo||up.turbo>0)?3.2-up.turbo*.45:99,driveF:DRIVE_F[model.drive],
    cda:B.cda,L:model.L,W:B.w};
  s.ratios=s.gearsN===6?R6:R5;
  const peak=s.hp*s.tm*745.7*.85;let lo=5,hi=150;
  for(let i=0;i<40;i++){const v=(lo+hi)/2;const need=(.6*s.cda*v*v+.015*s.mass*9.81)*v;if(need>peak)hi=v;else lo=v}
  s.vmax=lo; s.latCap=3+s.handling*7+s.grip*3;
  return s;
}
const powerCurve=rf=>clamp(1-Math.pow((rf-.8)/.75,2),.3,1);
function newRunner(spec){return{x:0,v:0,gear:1,rpm:.15,boost:0,shiftT:0,nitroLeft:spec.nitro,nitroOn:false,launchT:9,launchRpm:0,spinT:0,bogT:0,limiter:false,wheelspin:false,shifts:0,acc:0}}
function gearTop(spec,g){return spec.vmax*1.04*spec.ratios[g-1]}
function physStep(spec,r,dt,c){
  let gt=gearTop(spec,r.gear), rf=r.v/gt;
  if(r.launchT<.7){r.launchT+=dt;const k=1-r.launchT/.7;rf=Math.max(rf,r.launchRpm*k+rf*(1-k))}
  if(c.auto&&r.shiftT<=0){
    if(rf>c.auto&&r.gear<spec.gearsN){r.gear++;r.shiftT=spec.shiftTime;r.shifts++;r.justShifted=true}
    else if(rf<.42&&r.gear>1){r.gear--}
  }
  const tgt=c.throttle&&rf>.35?1:0;
  r.boost+=(tgt-r.boost)*Math.min(1,dt*spec.spool*(tgt?1:2.5));
  const tf=(spec.turboStock?.72+.28*r.boost:1)*(1+(spec.tm-1)*r.boost);
  let P=spec.hp*745.7*.85*tf*powerCurve(Math.min(rf,1))*(c.throttle?1:0)*(c.powerMul||1);
  r.nitroOn=false;
  if(c.nitro&&r.nitroLeft>0&&c.throttle){r.nitroLeft=Math.max(0,r.nitroLeft-dt);P*=1.4;r.nitroOn=true}
  r.limiter=rf>=1; if(r.limiter)P=0;
  if(r.shiftT>0){r.shiftT-=dt;P*=.05}
  let F=P/Math.max(r.v,2.5);
  let trac=spec.grip*spec.mass*9.81*spec.driveF*(c.offroad?.6:1);
  if(r.spinT>0){r.spinT-=dt;trac*=.68}
  if(r.bogT>0){r.bogT-=dt;F*=.5}
  r.wheelspin=F>trac&&r.v<25; if(F>trac)F=trac;
  const drag=.6*spec.cda*r.v*r.v+.015*spec.mass*9.81*(c.offroad?7:1);
  let a=(F-drag)/spec.mass; if(c.brake)a-=9.5;
  r.v=Math.max(0,r.v+a*dt); r.x+=r.v*dt; r.acc=a;
  r.rpm=clamp(rf,.12,1.02);
}
function simulate(spec){
  const r=newRunner(spec);r.launchT=0;r.launchRpm=.66;
  let t=0,t100=null;const dt=1/120;
  while(r.x<402&&t<40){physStep(spec,r,dt,{throttle:1,auto:.94});t+=dt;if(t100===null&&r.v>=27.78)t100=t}

}

function classOf(pi){let c=CLASSES[0];for(const k of CLASSES)if(pi>=k[0])c=k;return{name:c[1],color:c[2]}}
const _perfCache={};
function perf(model,up,o={}){
  const key=model.id+JSON.stringify(up)+(o.hpScale||1);
  if(_perfCache[key])return _perfCache[key];
  const spec=computeSpec(model,up,o),s=simulate(spec);
  const pi=Math.round((19.5-s.t402)*120+(spec.grip+spec.handling)*60+spec.nitro*8);
  return _perfCache[key]={spec,...s,pi};
}
function makeOpponentSpec(targetPI,excludeId){
  const pool=CARS.filter(c=>c.id!==excludeId);
  const base=c=>perf(c,{motor:0,turbo:0,cambio:0,pneus:0,susp:0,peso:0,nitro:0}).pi;
  const top=c=>perf(c,{motor:4,turbo:4,cambio:4,pneus:4,susp:4,peso:4,nitro:4}).pi;
  let cand=pool.filter(c=>base(c)<=targetPI+160&&top(c)>=targetPI);
  if(!cand.length)cand=[pool.reduce((a,b)=>base(a)<base(b)?a:b)];
  const model=pick(cand);
  const lv=clamp(Math.round((targetPI-base(model))/160),0,4);
  const up={};for(const k in PARTS)up[k]=clamp(lv+Math.round(rnd(-1,1)),0,4);
  let lo=.3,hi=4;
  for(let i=0;i<14;i++){const m=(lo+hi)/2;if(perf(model,up,{hpScale:m}).pi<targetPI)lo=m;else hi=m}
  const hpScale=(lo+hi)/2;
  return{model,up,spec:computeSpec(model,up,{hpScale}),pi:perf(model,up,{hpScale}).pi};
}

function migrate(d){

  d.cars=d.cars.filter(c=>CAR[c.model]);if(!d.cars.length)return b;
  const hx=/^#[0-9a-fA-F]{6}$/;
  d.cars.forEach(c=>{c.health={motor:100,turbo:100,cambio:100,...(c.health||{})};for(const k in c.health)c.health[k]=clamp(+c.health[k]||0,0,100);c.up={...UP0(),...c.up};for(const k in c.up)c.up[k]=clamp(Math.floor(+c.up[k]||0),0,4);

  makeRain(){const n=isTouch?900:1800,p=new Float32Array(n*6);this.drops=[];
    for(let i=0;i<n;i++)this.drops.push([rnd(-30,30),rnd(-8,22),rnd(-70,8)]);
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));

  place(m,x,d,yaw){const rc=this.rc,g=rc.g(d),pitch=Math.atan((rc.g(d+2)-rc.g(d-2))/4);m.position.set(x,g,-d);m.rotation.set(pitch,yaw,0,'YXZ')}

    else{m.visible=true;m.userData.paint.color.copy(lin(t.color))}t.mesh=m;this.live.add(t)}
  release(t){const m=t.mesh;m.visible=false;(this.pool[t.body]=this.pool[t.body]||[]).push(m);t.mesh=null;this.live.delete(t)}

    const R=this.R,rc=this.rc,p=rc.p,pr=p.r,cam=this.cam;
    if(this.W!==W||this.H!==H){R.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();this.W=W;this.H=H}
    const yawOf=(xv,v)=>-Math.atan(xv/Math.max(v,4));
    this.place(this.pm,p.x,pr.x,yawOf(p.xv,pr.v));this.pm.userData.bodyG.rotation.z=clamp(-p.xv*.012,-.06,.06);setBrake(this.pm,p.brake);

    popV(this.pm,pr);if(!this.popL){this.popL=new THREE.PointLight(lin('#ff8a2a'),0,9,2);this.scene.add(this.popL)}
    this.popL.intensity=pr.popT>0?2.5*(pr.popS||1):0;if(pr.popT>0){this.popL.position.copy(this.pm.position);this.popL.position.y+=.5;this.popL.position.z+=Math.cos(this.pm.rotation.y)*(rc.model.L/2+.5)}
    rc.rivals.forEach((a,i)=>{const m=this.rm[i];this.place(m,a.x,a.r.x,yawOf(a.xv,a.r.v));setBrake(m,a.brake);m.userData.flame.visible=a.r.nitroOn;popV(m,a.r)});
    const near=rc.traffic.filter(t=>t.d>pr.x-80&&t.d<pr.x+430),cur=new Set(near);for(const t of[...this.live])if(!cur.has(t))this.release(t);
    for(const t of near){if(!t.mesh)this.acquire(t);this.place(t.mesh,rc.wx(t.d,t.off),t.d,-Math.atan(rc.slope(t.d))+t.rot);setBrake(t.mesh,t.hit||(t.v<8))}
    // câmera
    const d=pr.x,sl=rc.slope(d+6),fwd=new THREE.Vector3(sl,0,-1).normalize(),P=new THREE.Vector3(p.x,rc.g(d),-d);
    const port=clamp((1.2-cam.aspect)*1.1,0,.75);let back=(6.6+pr.v*.025)*(1+port*1.1),up=(2.5+pr.v*.008)*(1+port*.7);
    const des=P.clone().addScaledVector(fwd,-back);des.y=Math.max(rc.g(d-back),rc.g(d))+up;
    if(rc.t<0){const a=(-rc.t/3.2)*2.2,r=7.5;des.set(P.x+Math.sin(a)*r,P.y+2.2+(-rc.t)*.6,P.z+Math.cos(a)*r)}
    if(this.first){cam.position.copy(des);this.first=false}else cam.position.lerp(des,1-Math.exp(-dt*(rc.t<0?3:6)));
    if(rc.shake>0){cam.position.x+=(Math.random()-.5)*rc.shake*.8;cam.position.y+=(Math.random()-.5)*rc.shake*.5}
    const look=P.clone().addScaledVector(fwd,9);look.y=rc.g(d+9)+1.1;cam.lookAt(look);
    const fov=58+port*14+clamp(pr.v/70,0,1)*14+(pr.nitroOn?6:0);cam.fov+=(fov-cam.fov)*Math.min(1,dt*3);cam.updateProjectionMatrix();
    this.skyG.position.set(cam.position.x,0,cam.position.z);
    this.sun.position.set(P.x+40,P.y+70,P.z+30);this.sun.target.position.copy(P);
    if(this.spot){this.spot.position.copy(P).addScaledVector(fwd,1.6);this.spot.position.y+=.9;this.spot.target.position.copy(P).addScaledVector(fwd,30)}

    if(this.rain){const a=this.rain.geometry.attributes.position.array,sp=pr.v*.7;let k=0;
      for(const q of this.drops){q[1]-=26*dt;q[2]+=sp*dt;if(q[1]<-8){q[1]+=30;q[0]=rnd(-30,30)}if(q[2]>8){q[2]-=78;q[0]=rnd(-30,30)}
        a[k++]=q[0];a[k++]=q[1];a[k++]=q[2];a[k++]=q[0]+.04;a[k++]=q[1]+.9;a[k++]=q[2]-.02*pr.v-.1}
      this.rain.geometry.attributes.position.needsUpdate=true;this.rain.position.copy(cam.position);this.rain.rotation.y=Math.atan2(-fwd.x,-fwd.z)}

  }
  dispose(){
    this.scene.traverse(o=>{if(o.geometry&&!Object.values(CARGEO).some(c=>Object.values(c).includes(o.geometry)))o.geometry.dispose();
      const ms=o.material?(Array.isArray(o.material)?o.material:[o.material]):[];ms.forEach(m=>{if(!Object.values(MATC).includes(m)){if(m.map&&!Object.values(R3.T).includes(m.map))m.map.dispose();m.dispose()}})});
    if(this.env)this.env.dispose();this.R.clear();

}

const Game={scene:null,raf:0,last:0,paused:false,ev:null,car:null,
  start(ev,bet,net){
    const car=activeCar();if(isBroken(car)){toast('Seu carro está quebrado. Conserte na Oficina.');TAB='oficina';render();return}this.ev=ev;this.car=car;this.bet=bet||0;
    S.money-=ev.entry+(bet||0);save();
    this.net=net||null;this.scene=ev.mode==='drag'?new DragRace(ev,car,net):new StreetRace(ev,car,bet,net);
    Input.clear();this.paused=false;$('#race').style.display='block';$('#rc3d').style.display=this.scene.v3?'block':'none';buildControls(ev.mode);
    Snd.startEngine();this.last=performance.now();cancelAnimationFrame(this.raf);this.raf=requestAnimationFrame(t=>this.loop(t));
  },
  loop(t){
    const dt=Math.min(.033,(t-this.last)/1000);this.last=t;
    if(!this.scene)return;
    if(Input.take('pause'))this.pause();
    if(!this.paused)this.scene.update(dt);
    const{ctx,w,h}=fit($('#rc'));this.scene.draw(ctx,w,h);
    this.raf=requestAnimationFrame(tt=>this.loop(tt));
  },
  pause(){if(!this.scene||this.scene.done)return;this.paused=true;Snd.stopEngine();
    modal(`<h2>Pausado</h2><p class="sub">Abandonar a corrida conta como derrota e não devolve a inscrição${this.bet?' nem a aposta':''}.</p><div class="acts"><button class="btn warn" data-act="quit">Abandonar</button><button class="btn pri" data-act="resume">Continuar</button></div>`,true)},
  resume(){closeModal();this.paused=false;Snd.startEngine();this.last=performance.now()},
  quit(){closeModal();this.finish({mode:this.ev.mode,won:false,pos:this.ev.mode==='rua'?4:2,total:this.ev.mode==='rua'?4:2,hits:this.scene.hits||0,nearMiss:0,nmCash:0,perfect:0,dnf:true,bet:this.bet})},
  finish(res){
    if(!this.scene)return;this.scene.done=true;const ev=this.ev,car=this.car,model=CAR[car.model];
    Snd.stopEngine();
    const st=styleScore(car),repBonus=1+st*.003;
    let prize=0,betWin=0;
    if(!res.dnf){
      if(ev.mode==='drag')prize=res.won?ev.prize:0;
      else if(ev.mode==='rua')prize=Math.round(ev.prize*([1,.45,.2,0][res.pos-1]||0));
      else{prize=res.won?ev.prize:0;betWin=res.won?this.bet*2:0}
      if(ev.online){prize=0;betWin=res.won?this.bet*2:0}
    }
    if(ev.online){if(res.won)S.stats.onW=(S.stats.onW|0)+1;else S.stats.onL=(S.stats.onL|0)+1}
    const repBase=res.dnf?0:res.won?ev.rep:ev.mode==='rua'?ev.rep*([1,.55,.35,.2][res.pos-1]||.2):ev.rep*.3;
    const rep=Math.round(repBase*repBonus+res.perfect*5+res.nearMiss*3);
    const sc=this.scene,dm={};let dmgTxt='';
    if(sc&&sc.dmg){for(const k of['motor','turbo','cambio']){const before=car.health[k];car.health[k]=sc.broken[k]?0:Math.max(0,Math.round((before-sc.dmg[k])*10)/10);dm[k]=before-car.health[k]}}
    const repair=res.hits*repairUnit(model);
    const nm=res.nmCash||0;
    const net=prize+betWin+nm-repair;
    S.money+=net;S.stats.races++;if(res.won)S.stats.wins++;
    const earned=prize+betWin+nm;S.stats.earned+=earned;S.stats.nearMiss+=res.nearMiss||0;S.stats.perfect+=res.perfect||0;
    if(ev.mode==='drag'&&res.et&&!res.jump&&res.won!==undefined&&res.et>0){if(!S.stats.best402||res.et<S.stats.best402)S.stats.best402=res.et}
    if(res.won)track(ev.mode==='drag'?'winDrag':ev.mode==='racha'?'winRacha':'winRua');
    if(res.nearMiss)track('nearMiss',res.nearMiss);if(res.perfect)track('perfect',res.perfect);if(earned>0)track('earn',earned);
    const ups=addXP(rep);save();
    if(net>0)Snd.cash();
    setTimeout(()=>{const el=document.getElementById('vsName');if(el&&this.net)el.textContent=this.net.oppName},0);
    const vsTxt=ev.online&&this.net?` contra <span id="vsName"></span>`:'';
    const title=res.failed==='motor'?'MOTOR BATEU':res.dnf?'Abandonou':res.won?'VITÓRIA':ev.mode==='rua'?res.pos+'º LUGAR':'DERROTA';
    const col=res.failed?'var(--rd)':res.won?'var(--ac)':res.dnf?'var(--mu)':'var(--rd)';
    let det='';
    if(ev.mode==='drag'&&!res.dnf){det=`<div class="kpis"><div class="kpi"><b>${res.react!=null?res.react.toFixed(3)+'s':'—'}</b><small>Reação</small></div><div class="kpi"><b>${res.et?res.et.toFixed(2)+'s':'—'}</b><small>Tempo 402m</small></div><div class="kpi"><b>${Math.round(res.trap)}</b><small>km/h final</small></div></div>`;
      if(res.jump)det+=`<p class="sub" style="margin-top:10px;color:var(--rd)">Você soltou a embreagem antes da luz verde.</p>`;
      else if(res.margin!=null)det+=`<p class="sub" style="margin-top:10px">Diferença na chegada: ${res.margin.toFixed(3)}s</p>`}
    else if(!res.dnf){det=`<div class="kpis"><div class="kpi"><b>${res.pos}º/${res.total}</b><small>Posição</small></div><div class="kpi"><b>${res.nearMiss}</b><small>Raspões</small></div><div class="kpi"><b>${Math.round(res.trap)}</b><small>km/h máx</small></div></div>`}
    const L=(a,b,cl)=>`<div><span>${a}</span><span class="${cl||''}">${b}</span></div>`;
    let lines=L('Inscrição','−'+fmt(ev.entry),'neg');
    if(ev.mode==='racha'||ev.online)lines=L('Aposta',this.bet?'−'+fmt(this.bet):'—','neg');
    if(prize)lines+=L('Prêmio','+'+fmt(prize),'pos');if(betWin)lines+=L('Aposta ganha','+'+fmt(betWin),'pos');
    if(nm)lines+=L(`Raspões (${res.nearMiss})`,'+'+fmt(nm),'pos');if(repair)lines+=L(`Funilaria (${res.hits} batida${res.hits>1?'s':''})`,'−'+fmt(repair),'neg');
    if(sc&&sc.dmg){const nm2={motor:'Motor',turbo:'Turbo',cambio:'Câmbio'};const parts=Object.keys(dm).filter(k=>dm[k]>=.5||sc.broken[k]).map(k=>sc.broken[k]?`<b style="color:var(--rd)">${nm2[k]} QUEBRADO</b>`:`${nm2[k]} −${Math.round(dm[k])}%`);
      if(parts.length)lines+=L('Desgaste',parts.join(' · '),Object.keys(sc.broken).length?'neg':'')}
    lines+=L(`Reputação${st?` (estilo +${Math.round(st*.3)}%)`:''}`,'+'+rep+' XP','pos');
    const upsTxt=ups.map(u=>`<p class="sub" style="color:var(--ac2);margin:6px 0 0">Subiu para o nível ${u[0]}! Bônus de ${fmt(u[1])}.</p>`).join('');
    modal(`<div class="big" style="color:${col}">${title}</div><p class="sub" style="text-align:center">${ev.name}${vsTxt} · ${model.name}</p>${det}<div class="lines">${lines}</div>${upsTxt}${sc&&sc.dmg&&Object.keys(sc.broken).length?'<p class="sub" style="color:var(--ac2);margin:8px 0 0">Leve o carro na Oficina para consertar.</p>':''}${ev.online?`<div class="acts"><button class="btn" data-act="leave">Voltar</button>${this.net&&NET.peer(this.net.peer)?`<button class="btn pri" data-act="rematch" data-v="${this.net.peer}">Revanche</button>`:''}</div>`:`<div class="acts"><button class="btn" data-act="leave">Garagem</button><button class="btn pri" data-act="again">Correr de novo</button></div>`}`,true);
  },
  dispose(){if(this.scene&&this.scene.v3){try{this.scene.v3.dispose()}catch(e){}this.scene.v3=null}},
  leave(){closeModal();cancelAnimationFrame(this.raf);this.dispose();this.scene=null;this.net=null;NET.end();Input.clear();$('#race').style.display='none';render()},
};

function isBroken(car){return(car.health&&(car.health.motor<=0||car.health.cambio<=0))}
function repairCost(car,k){const m=CAR[car.model],h=car.health[k];if(h>=100)return 0;
  const base={motor:500+m.price*.04+car.up.motor*1500+car.up.turbo*500,turbo:300+m.price*.02+car.up.turbo*1200,cambio:250+m.price*.015+car.up.cambio*800}[k];
  return Math.round(base*(100-h)/100*(h<=0?1.5:1)/10)*10}
function maintHTML(car){
  const ks=['motor',...(hasTurbo(car)?['turbo']:[]),'cambio'];let tot=0;
  const rows=ks.map(k=>{const h=car.health[k],c=repairCost(car,k);tot+=c;const col=h<=0?'var(--rd)':h<40?'#ff8a3d':h<70?'var(--ac2)':'var(--gr)';
    return`<div class="statrow" style="grid-template-columns:90px 1fr 70px auto"><span>${HEALTH_NAMES[k]}</span><div class="bar"><div style="width:${h}%;background:${col}"></div></div><b style="color:${col}">${h<=0?'QUEBRADO':Math.round(h)+'%'}</b>
      <button class="btn sm ${c&&S.money>=c?'pri':''}" ${!c||S.money<c?'disabled':''} data-act="fix" data-v="${k}">${c?(h<=0?'Retificar ':'Reparar ')+fmt(c):'OK'}</button></div>`}).join('');
  return`<div class="panel" style="margin-bottom:14px;${isBroken(car)?'border-color:var(--rd)':''}"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="font-size:18px">Manutenção</h2><p class="sub" style="margin:2px 0 6px">Ficar no corte de giro, reduzir no giro alto, abusar do nitro e preparação forte desgastam as peças. Com desgaste alto, o motor perde força e pode bater.</p></div>
    ${tot?`<button class="btn sm ${S.money>=tot?'pri':''}" ${S.money<tot?'disabled':''} data-act="fixall">Reparar tudo · ${fmt(tot)}</button>`:''}</div>${rows}</div>`;
}
function vOficina(m){
  const car=activeCar(),model=CAR[car.model],pf=perf(model,car.up);
  const rows=Object.entries(PARTS).map(([k,P])=>{const lv=car.up[k],nx=lv+1;const cost=nx<=4?partCost(model,k,nx):0;
    let prev='';if(nx<=4){const u={...car.up,[k]:nx};const np=perf(model,u).pi;prev=`PI ${pf.pi} → <b style="color:var(--ac)">${np}</b>`}
    const turboNote=k==='turbo'&&!model.turbo&&lv===0?' (instala kit turbo)':'';
    return`<div class="part"><div><h4>${P.name} <span style="color:var(--mu);font-size:14px">· ${LV_NAMES[lv]}</span></h4><p>${P.desc}${turboNote}</p><div class="pips">${[1,2,3,4].map(i=>`<i class="${i<=lv?'f':''}"></i>`).join('')}</div></div>
    <div style="text-align:right">${nx<=4?`<div style="font-size:13px;color:var(--mu);margin-bottom:6px">${prev}</div><button class="btn sm ${S.money>=cost?'pri':''}" ${S.money<cost?'disabled':''} data-act="part" data-v="${k}">${LV_NAMES[nx]} · ${fmt(cost)}</button>`:'<span class="tag a">Máximo</span>'}</div></div>`}).join('');
  m.innerHTML=`<h2>Oficina de performance</h2><p class="sub">${model.name} · potencial de preparação ${model.tune>=1.3?'altíssimo':model.tune>=1.15?'alto':'normal'} · peças fortes desgastam mais</p>${maintHTML(car)}
  <div class="grid g2"><div>${rows}</div><div class="panel" style="align-self:start"><canvas class="stage" style="height:180px" data-car="${model.id}" data-uid="${car.uid}"></canvas><div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px"><h2 style="font-size:18px">${model.name}</h2>${clsBadge(pf.pi)}</div>${statBars(car)}</div></div>`;
}

  m.innerHTML=`<h2>Visual & estilo</h2><p class="sub">Cada item soma estilo, e estilo multiplica a reputação ganha nas corridas (até +30%).</p>
  <div class="grid g2"><div class="panel" style="align-self:start;position:sticky;top:120px"><canvas class="stage" data-car="${model.id}" data-uid="${car.uid}"></canvas><div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><h2 style="font-size:18px">${model.name}</h2><span class="tag a" style="font-size:14px">Estilo ${styleScore(car)}%</span></div></div>
  <div class="panel">
   <div class="optgroup"><h4>Pintura <span>${fmt(VIS.paintP)} · personalizada ${fmt(VIS.customP)}</span></h4><div class="opts">${PALETTE.map(c=>`<button class="sw ${v.color===c?'on':''}" style="background:${c}" data-act="paint" data-v="${c}"></button>`).join('')}<input type="color" id="customColor" value="${v.color.length===7?v.color:'#ffffff'}" title="Cor personalizada"></div></div>
   <div class="optgroup"><h4>Rodas</h4><div class="opts">${VIS.wheel.map((w,i)=>opt('wheel',i,w.n,w.p)).join('')}</div>
    <div class="opts" style="margin-top:8px">${WHEEL_COLORS.map(c=>`<button class="sw ${v.wheelColor===c?'on':''}" style="background:${c};width:28px;height:28px" data-act="wcolor" data-v="${c}"></button>`).join('')}<small style="color:var(--mu);align-self:center">cor da roda ${fmt(VIS.wheelColorP)}</small></div></div>
   <div class="optgroup"><h4>Rebaixamento <span>${fmt(VIS.heightP)} · exige suspensão</span></h4><div class="opts">${VIS.height.map((n,i)=>opt('height',i,n,i?VIS.heightP:0,i>maxH?`Precisa suspensão ${LV_NAMES[i]}`:'')).join('')}</div></div>
   <div class="optgroup"><h4>Insulfilm <span>${fmt(VIS.tintP)}</span></h4><div class="opts">${VIS.tint.map((n,i)=>opt('tint',i,n,i?VIS.tintP:0)).join('')}</div></div>
   <div class="optgroup"><h4>Faixas</h4><div class="opts">${VIS.stripe.map((w,i)=>opt('stripe',i,w.n,w.p)).join('')}</div>${v.stripe?`<div class="opts" style="margin-top:8px">${['#111111','#ffffff','#d7263d','#f2c200','#1e5bd8','#c6ff3d'].map(c=>`<button class="sw ${v.stripeColor===c?'on':''}" style="background:${c};width:28px;height:28px" data-act="scolor" data-v="${c}"></button>`).join('')}</div>`:''}</div>
   <div class="optgroup"><h4>Aerofólio</h4><div class="opts">${VIS.spoiler.map((w,i)=>opt('spoiler',i,w.n,w.p)).join('')}</div></div>
   <div class="optgroup"><h4>Neon</h4><div class="opts">${VIS.neon.map((w,i)=>opt('neon',i,w.n,w.p)).join('')}</div>${v.neon?`<div class="opts" style="margin-top:8px">${['#3db8ff','#c6ff3d','#ff4fa3','#7b2ff7','#ff4d5a'].map(c=>`<button class="sw ${v.neonColor===c?'on':''}" style="background:${c};width:28px;height:28px" data-act="ncolor" data-v="${c}"></button>`).join('')}</div>`:''}</div>
  </div></div>`;
  const cc=$('#customColor');cc.addEventListener('change',()=>buyVis(car,'color',cc.value,VIS.customP));
}
function buyVis(car,key,val,price){
  if(car.vis[key]===val)return;
  if(price&&S.money<price){toast('Dinheiro insuficiente');return}
  S.money-=price;car.spent+=price;car.vis[key]=val;if(price&&val)track('style');save();render();
}

  m.innerHTML=`<h2>Concessionária</h2><p class="sub">10 projetos do cenário nacional. Carros comprados podem ser vendidos por 70% do valor + 50% do que foi investido.</p>
  <div class="grid g3">${CARS.map(c=>{const pf=perf(c,UP0());const own=S.cars.filter(x=>x.model===c.id);
   return`<div class="card"><canvas data-car="${c.id}" data-small="1"></canvas><div class="cb"><div style="display:flex;justify-content:space-between;align-items:center;gap:6px"><h3>${c.name}</h3>${clsBadge(pf.pi)}</div><div class="tags" style="margin:0"><span class="tag a">${c.cat}</span><span class="tag">${c.drive}</span>${c.turbo&&c.cat!=='Turbo'?'<span class="tag">Turbo</span>':''}${own.length?`<span class="tag" style="color:var(--ac2)">Na garagem ×${own.length}</span>`:''}</div><p>${c.desc}</p>
   <div class="mini"><div><b>${c.hp} cv</b>potência</div><div><b>${pf.t100.toFixed(1)}s</b>0-100</div><div><b>${pf.t402.toFixed(1)}s</b>402m</div></div>
   <div class="row"><span class="price">${fmt(c.price)}</span><div style="display:flex;gap:6px">${own.length&&S.cars.length>1?`<button class="btn sm" data-act="sell" data-v="${own[0].uid}">Vender</button>`:''}<button class="btn sm ${S.money>=c.price?'pri':''}" ${S.money<c.price?'disabled':''} data-act="buy" data-v="${c.id}">Comprar</button></div></div></div></div>`}).join('')}</div>`;

function vEventos(m){
  const car=activeCar(),pf=perf(CAR[car.model],car.up);
  const evs=EVENTS.filter(e=>e.mode===MODE);
  m.innerHTML=`<h2>Eventos</h2><p class="sub">Correndo com <b>${CAR[car.model].name}</b> · ${clsBadge(pf.pi)}</p>
  <div class="modes">${Object.entries(MODES).map(([k,v])=>`<button class="mode ${MODE===k?'on':''}" data-act="mode" data-v="${k}"><b>${v.n}</b><span>${v.d}</span></button>`).join('')}</div>
  <div class="grid g3">${evs.map(e=>{const lock=S.level<e.lvl;const diff=pf.pi-e.pi;const dl=diff>60?['Fácil','var(--gr)']:diff>-30?['Equilibrado','var(--ac2)']:diff>-110?['Difícil','#ff8a3d']:['Muito difícil','var(--rd)'];
   return`<div class="ev ${lock?'lock':''}">${lock?`<span class="lk">Nível ${e.lvl}</span>`:''}<h3>${e.name}</h3><div class="pl">${e.sky?({night:'Noite',dusk:'Entardecer',rain:'Chuva',day:'Dia'})[e.sky]+' · ':''}${e.place}${e.dist?` · ${(e.dist/1000).toFixed(1)} km`:' · 402 m'}</div>
   <div class="vals"><div>Prêmio<b style="color:var(--ac)">${fmt(e.prize)}</b></div><div>${e.mode==='racha'?'Aposta até':'Inscrição'}<b>${fmt(e.mode==='racha'?e.maxBet:e.entry)}</b></div><div>Rivais<b>PI ~${e.pi}</b></div></div>
   <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:700;color:${dl[1]}">${dl[0]}</span><button class="btn sm pri" ${lock?'disabled':''} data-act="ev" data-v="${e.id}">Correr</button></div></div>`}).join('')}</div>`;
}
function openEvent(id){
  const e=EVENTS.find(x=>x.id===id),car=activeCar(),model=CAR[car.model],pf=perf(model,car.up);
  const brk=isBroken(car),can=S.money>=e.entry&&!brk;
  const betMax=Math.max(0,Math.min(e.maxBet||0,S.money));
  const help={drag:'Segure ACELERAR para segurar o giro na faixa verde (launch armado), solte a embreagem com MARCHA na luz verde e troque quando a shift light acender toda. Bater no corte esquenta o motor.',racha:'Um contra um no trânsito. Passar de raspão rende dinheiro; bater custa funilaria e tempo.',rua:'Quatro carros. Freie antes das curvas fechadas: velocidade demais te joga pra fora.'}[e.mode];
  modal(`<h2>${e.name}</h2><p class="sub">${MODES[e.mode].n} · ${e.place}</p>
   <div class="kpis"><div class="kpi"><b>${pf.pi}</b><small>Seu PI</small></div><div class="kpi"><b>~${e.pi}</b><small>Rivais</small></div><div class="kpi"><b style="color:var(--ac)">${fmt(e.prize)}</b><small>Prêmio</small></div></div>
   <p class="sub" style="margin-top:12px">${help}</p>
   ${e.mode==='racha'?`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-weight:700"><span>Aposta</span><span id="betv">${fmt(0)}</span></div><input type="range" id="bet" min="0" max="${betMax}" step="${Math.max(50,Math.round(betMax/20/50)*50)}" value="0"><p class="sub" style="margin:4px 0 0">Ganhou, leva o dobro. Perdeu, fica com o rival.</p></div>`:`<div class="lines"><div><span>Inscrição</span><span>${fmt(e.entry)}</span></div><div><span>Funilaria por batida</span><span>${fmt(repairUnit(model))}</span></div></div>`}
   <div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" ${can?'':'disabled'} data-act="go" data-v="${e.id}">${brk?'Carro quebrado':can?'Largar':'Sem dinheiro'}</button></div>${brk?'<p class="sub" style="color:var(--rd);margin:8px 0 0">Motor ou câmbio quebrado. Conserte na Oficina.</p>':''}`);
  const b=$('#bet');if(b)b.addEventListener('input',()=>$('#betv').textContent=fmt(+b.value));
}

  m.innerHTML=`<h2>Patrocínios</h2><p class="sub">Contratos com oficinas e lojas da quebrada. Cumpra, resgate e um novo contrato aparece.</p>
  <div class="mis" style="border-color:${dOK?'var(--ac2)':'var(--ln)'}"><div><div class="sp">Bônus diário · sequência ${S.daily.streak} dia${S.daily.streak===1?'':'s'}</div><h4>Passe na garagem todo dia</h4><p class="sub" style="margin:0">Quanto maior a sequência, maior o bônus.</p></div><button class="btn ${dOK?'pri':''}" ${dOK?'':'disabled'} data-act="daily">${dOK?'Resgatar '+fmt(dailyAmount()):'Volte amanhã'}</button></div>
  ${S.missions.map(x=>`<div class="mis"><div><div class="sp">${x.sp}</div><h4>${x.txt}</h4><div class="prog"><div style="width:${x.p/x.n*100}%"></div></div><p class="sub" style="margin:6px 0 0">${x.t==='earn'?fmt(x.p)+' / '+fmt(x.n):x.p+' / '+x.n} · Recompensa ${fmt(x.cash)} + ${x.rep} XP</p></div><button class="btn ${x.p>=x.n?'pri':''}" ${x.p>=x.n?'':'disabled'} data-act="claim" data-v="${x.id}">Resgatar</button></div>`).join('')}`;
}
function vConta(m){
  const st=S.stats;
  const tg=(k,label,desc)=>`<div class="tgl"><div>${label}<div style="color:var(--mu);font-size:13px;font-weight:500">${desc}</div></div><button class="${S.settings[k]?'on':''}" data-act="set" data-v="${k}"></button></div>`;
  m.innerHTML=`<h2>Conta</h2><p class="sub">Configurações, estatísticas e backup do progresso.</p>
  <div class="grid g2"><div class="panel">${tg('sound','Som','Motor, turbo e efeitos')}${tg('autoShift','Câmbio automático','Vale para todos os modos. Mais fácil, mas sem troca perfeita e sem controle de redução')}${tg('autoGas','Acelerador automático na rua/racha','Recomendado no celular')}${tg('view3d','Câmera 3D na rua/racha','Visão atrás do carro. Desligue para a visão de cima (mais leve)')}
   <h2 style="font-size:18px;margin-top:16px">Estatísticas</h2><div class="kpis"><div class="kpi"><b>${st.races}</b><small>Corridas</small></div><div class="kpi"><b>${st.wins}</b><small>Vitórias</small></div><div class="kpi"><b>${st.best402?st.best402.toFixed(2)+'s':'—'}</b><small>Melhor 402m</small></div><div class="kpi"><b>${fmt(st.earned)}</b><small>Faturado</small></div><div class="kpi"><b>${st.nearMiss}</b><small>Raspões</small></div><div class="kpi"><b>${st.perfect}</b><small>Trocas perfeitas</small></div></div></div>
  <div class="panel"><h2 style="font-size:18px">Backup</h2><p class="sub">O progresso fica salvo neste navegador. Copie o código para levar para outro aparelho.</p>
   <textarea id="saveCode" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
   <div style="display:flex;gap:8px;margin:8px 0 16px;flex-wrap:wrap"><button class="btn sm" data-act="copy">Copiar código</button></div>
   <textarea id="importCode" placeholder="Cole aqui um código de backup"></textarea>
   <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" data-act="import">Importar</button><button class="btn sm warn" data-act="reset">Recomeçar do zero</button></div></div></div>`;
}
const ACT={
  tab:d=>{TAB=d.v;render();scrollTo(0,0)},mode:d=>{MODE=d.v;render()},
  sel:d=>{S.active=+d.v;save();render()},
  snd:()=>{S.settings.sound=!S.settings.sound;save();render()},
  set:d=>{S.settings[d.v]=!S.settings[d.v];save();render()},
  part:d=>{const car=activeCar(),model=CAR[car.model],nx=car.up[d.v]+1;if(nx>4)return;const c=partCost(model,d.v,nx);if(S.money<c)return;S.money-=c;car.spent+=c;car.up[d.v]=nx;track('part');Snd.noise(.15,.1,900);save();toast(`${PARTS[d.v].name} ${LV_NAMES[nx]} instalado`);render()},
  vis:d=>{const car=activeCar(),k=d.k,i=+d.v,model=CAR[car.model];
    if(k==='height'&&i>Math.max(car.up.susp,(model.preset&&model.preset.height)||0)){toast(`Instale suspensão ${LV_NAMES[i]} na Oficina primeiro`);return}
    const price=k==='height'?(i?VIS.heightP:0):k==='tint'?(i?VIS.tintP:0):VIS[k][i].p;buyVis(car,k,i,price)},
  paint:d=>buyVis(activeCar(),'color',d.v,VIS.paintP),
  wcolor:d=>buyVis(activeCar(),'wheelColor',d.v,VIS.wheelColorP),
  scolor:d=>buyVis(activeCar(),'stripeColor',d.v,0),ncolor:d=>buyVis(activeCar(),'neonColor',d.v,0),
  buy:d=>{const c=CAR[d.v];if(S.money<c.price)return;modal(`<h2>Comprar ${c.name}?</h2><p class="sub">${fmt(c.price)} · ele vira seu carro ativo.</p><div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="buyok" data-v="${c.id}">Comprar</button></div>`)},
  buyok:d=>{const c=CAR[d.v];if(S.money<c.price)return;S.money-=c.price;const car=addCar(S,c.id);S.active=car.uid;save();closeModal();Snd.cash();toast(c.name+' na garagem!');TAB='garagem';render()},
  sell:d=>{const car=S.cars.find(c=>c.uid==d.v);if(!car||S.cars.length<2)return;modal(`<h2>Vender ${CAR[car.model].name}?</h2><p class="sub">Você recebe ${fmt(carValue(car))}. Peças e visual vão junto.</p><div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn warn" data-act="sellok" data-v="${car.uid}">Vender</button></div>`)},
  sellok:d=>{const car=S.cars.find(c=>c.uid==d.v);if(!car||S.cars.length<2)return;S.money+=carValue(car);S.cars=S.cars.filter(c=>c!==car);if(S.active===car.uid)S.active=S.cars[0].uid;save();closeModal();Snd.cash();render()},
  ev:d=>openEvent(d.v),
  go:d=>{const e=EVENTS.find(x=>x.id===d.v);const b=$('#bet');const bet=b?+b.value:0;if(S.money<e.entry+bet)return;closeModal();Game.start(e,bet)},
  close:()=>closeModal(),
  pause:()=>Game.pause(),resume:()=>Game.resume(),quit:()=>Game.quit(),leave:()=>Game.leave(),
  again:()=>{const e=Game.ev,bet=Game.bet;closeModal();cancelAnimationFrame(Game.raf);Game.dispose();Game.scene=null;$('#race').style.display='none';render();if(S.money>=e.entry+bet&&(e.mode!=='racha'||bet<=S.money))Game.start(e,bet);else{toast('Dinheiro insuficiente');}},
  claim:d=>{const x=S.missions.find(m=>m.id==d.v);if(!x||x.p<x.n)return;S.money+=x.cash;const ups=addXP(x.rep);S.missions=S.missions.filter(m=>m!==x);save();Snd.cash();toast(`${x.sp} pagou ${fmt(x.cash)}`+(ups.length?` · nível ${S.level}!`:''));render()},
  daily:()=>{if(S.daily.last===today())return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.daily.streak=S.daily.last===y?S.daily.streak+1:1;const a=dailyAmount();S.money+=a;S.daily.last=today();save();Snd.cash();toast('Bônus diário: '+fmt(a));render()},
  copy:()=>{const t=$('#saveCode');try{navigator.clipboard.writeText(t.value).then(()=>toast('Código copiado'),()=>{t.select();toast('Selecionado: use Ctrl+C')})}catch(e){t.select();toast('Selecionado: use Ctrl+C')}},
  import:()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($('#importCode').value.trim()))));S=migrate(d);save();toast('Progresso importado');render()}catch(e){toast('Código inválido')}},
  reset:()=>modal(`<h2>Recomeçar do zero?</h2><p class="sub">Todo o progresso deste navegador será apagado.</p><div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn warn" data-act="resetok">Apagar tudo</button></div>`),
  netch:d=>{if(isBroken(activeCar())){toast('Conserte o carro na Oficina antes de desafiar');return}openChallenge(d.v)},
  fix:d=>{const car=activeCar(),c=repairCost(car,d.v);if(!c||S.money<c)return;S.money-=c;car.health[d.v]=100;Snd.noise(.2,.12,900);save();toast(HEALTH_NAMES[d.v]+' novo em folha');render()},
  fixall:()=>{const car=activeCar();let tot=0;for(const k of['motor','turbo','cambio'])tot+=repairCost(car,k);if(!tot||S.money<tot)return;S.money-=tot;car.health={motor:100,turbo:100,cambio:100};Snd.cash();save();toast('Carro revisado');render()},
  roomcreate:()=>{const c=Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');NET.joinRoom(c);toast('Sala criada! Mande o link para a galera.')},
  roomjoin:()=>{const v=($('#roomCode').value||'').trim();NET.joinRoom(v)},

/* ---------- 11b. SALA P2P (WebRTC via PeerJS) — mesma interface do "room" ---------- */
function makeP2PRoom(code){
  const HOST_ID='rachabr-vc-'+code;const opts=Object.assign({debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}},window.PEER_OPTS||{});
  const me=S.pid,mine={};let peer=null,isHost=false,conns=new Map(),hostConn=null,table={},alive=true,openT=0,fireT=0,connected=false;
  const cbs=[],ccbs=[];
  const snap=()=>{const a=[{peer:me,by:me,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:JSON.parse(JSON.stringify(mine)),updatedAt:Date.now()}];
    for(const id in table)if(id!==me)a.push({peer:id,by:id,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:table[id].p,updatedAt:table[id].t});return a};
  const fire=()=>{if(fireT)return;fireT=setTimeout(()=>{fireT=0;const ps=snap();cbs.forEach(f=>{try{f({peers:ps,joined:[],left:[],updated:[]})}catch(e){console.warn(e)}})},25)};
  const setConn=c=>{if(connected===c)return;connected=c;ccbs.forEach(f=>f(c))};
  const relay=(m,except)=>{for(const[c]of conns)if(c!==except&&c.open)try{c.send(m)}catch(e){}};
  const mineMsg=()=>({t:'p',id:me,p:mine});
  const onData=(c,m)=>{if(!m||typeof m!=='object')return;
    if(m.t==='p'&&typeof m.id==='string'&&m.id!==me&&m.p&&typeof m.p==='object'){if(c)c._pid=m.id;table[m.id]={p:m.p,t:Date.now()};fire();if(isHost)relay(m,c)}
    else if(m.t==='bye'&&typeof m.id==='string'){delete table[m.id];fire();if(isHost)relay(m,c)}
    else if(m.t==='all'&&!isHost&&Array.isArray(m.list)){for(const e of m.list)if(e&&e.id&&e.id!==me&&e.p)table[e.id]={p:e.p,t:Date.now()};fire()}};
  function start(){
    if(!alive)return;isHost=false;hostConn=null;conns.clear();table={};fire();
    peer=new Peer(HOST_ID,opts);
    peer.on('open',()=>{isHost=true;setConn(true);fire()});
    peer.on('connection',c=>{
      c.on('open',()=>{conns.set(c,1);try{c.send({t:'all',list:[{id:me,p:mine},...Object.entries(table).map(([id,v])=>({id,p:v.p}))]})}catch(e){}});
      c.on('data',m=>onData(c,m));
      const gone=()=>{if(!conns.has(c))return;conns.delete(c);if(c._pid){delete table[c._pid];relay({t:'bye',id:c._pid});fire()}};c.on('close',gone);c.on('error',gone)});
    peer.on('error',e=>{if(e.type==='unavailable-id'){try{peer.destroy()}catch(_){}client()}else if(isHost&&(e.type==='network'||e.type==='server-error'||e.type==='socket-error')){setConn(false);setTimeout(restart,3000)}});
    peer.on('disconnected',()=>{if(alive&&peer&&!peer.destroyed)try{peer.reconnect()}catch(_){}});
  }
  function client(){
    if(!alive)return;peer=new Peer(opts);
    peer.on('open',()=>{hostConn=peer.connect(HOST_ID,{reliable:true});clearTimeout(openT);
      openT=setTimeout(()=>{if(!hostConn||!hostConn.open){NET.netErr='Não conectou à sala. A rede pode estar bloqueando conexão direta (tente no Wi-Fi). Tentando de novo…';refreshOnline();restart()}},12000);
      hostConn.on('open',()=>{clearTimeout(openT);NET.netErr=null;setConn(true);try{hostConn.send(mineMsg())}catch(e){}});
      hostConn.on('data',m=>onData(null,m));
      hostConn.on('close',()=>{setConn(false);table={};fire();setTimeout(restart,400+Math.random()*1600)})});
    peer.on('error',e=>{if(e.type==='peer-unavailable'){setTimeout(restart,500+Math.random()*1500)}else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){setConn(false);NET.netErr='Sem conexão com o servidor de salas. Tentando de novo…';refreshOnline();setTimeout(restart,4000)}});
  }
  function restart(){clearTimeout(openT);try{peer&&peer.destroy()}catch(e){}if(alive)start()}
  addEventListener('beforeunload',()=>{try{peer&&peer.destroy()}catch(e){}});
  start();
  return{
    presence(patch){for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k]}const m=mineMsg();
      if(isHost)relay(m);else if(hostConn&&hostConn.open)try{hostConn.send(m)}catch(e){}fire();return Promise.resolve()},
    onPeers(f){cbs.push(f);fire();return()=>{}},
    onConnection(f){ccbs.push(f);setTimeout(()=>f(connected),0);return()=>{}},
    connected:()=>connected,peers:snap,
    leave(){alive=false;clearTimeout(openT);try{peer&&peer.destroy()}catch(e){}},
  };
}

  const share=NET.mode==='p2p'?`<div class="panel" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><div style="flex:1;min-width:200px"><div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mu);font-weight:700">Sala ${NET.roomCode}</div><div style="font-weight:700;word-break:break-all" id="roomLink"></div></div>
     <button class="btn sm pri" data-act="roomshare">Convidar</button><a class="btn sm" id="waLink" target="_blank" rel="noopener">WhatsApp</a><button class="btn sm" data-act="roomcopy">Copiar link</button><button class="btn sm warn" data-act="roomleave">Sair da sala</button></div>`+(NET.netErr?`<p class="sub" style="color:var(--ac2)">${NET.netErr}</p>`:''):'';
  return share+`<div class="sub" style="display:flex;align-items:center;gap:8px"><span style="width:9px;height:9px;border-radius:50%;background:${NET.connected?'var(--gr)':'var(--ac2)'};display:inline-block"></span>${NET.connected?'Conectado':'Conectando…'} · ${os.length} amigo${os.length===1?'':'s'} online</div>
    <div class="grid g3">${list}</div>`+rankHTML();
}
function rankHTML(){
  const rows=NET.rank.slice().sort((a,b)=>(b.ow|0)-(a.ow|0)||(b.wins|0)-(a.wins|0)||((a.best||99)-(b.best||99)));
  if(!NET.db&&NET.mode!=='p2p')return'';
  return`<h2 style="font-size:18px;margin-top:22px">Ranking da galera</h2><p class="sub">Vitórias online primeiro, depois vitórias no total e melhor tempo nos 402 m.</p>
   <div class="panel" style="padding:0;overflow:auto">${rows.length?`<table style="width:100%;border-collapse:collapse;font-weight:600">
   <tr style="color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.6px;text-align:left"><th style="padding:10px 14px">#</th><th>Piloto</th><th>Nível</th><th>Online V/D</th><th>Vitórias</th><th>Melhor 402m</th><th>Carro</th></tr>
   ${rows.map((r,i)=>`<tr style="border-top:1px solid var(--ln)${r.id===NET.myId?';background:rgba(198,255,61,.06)':''}"><td style="padding:10px 14px;font-family:'Russo One','Arial Black',sans-serif;color:${i<3?'var(--ac2)':'var(--mu)'}">${i+1}</td><td data-rankname="${r.id}"></td><td>${r.lvl|0}</td><td>${r.ow|0} / ${r.ol|0}</td><td>${r.wins|0}</td><td>${r.best?(+r.best).toFixed(2)+'s':'—'}</td><td>${CAR[r.car]?CAR[r.car].name:'—'} <span style="color:var(--mu)">· ${r.pi|0}</span></td></tr>`).join('')}</table>`:'<div class="empty">Ninguém no ranking ainda. Termine uma corrida para entrar.</div>'}</div>`;
}
function bindNetCanvases(){
  const rl=document.getElementById('roomLink');if(rl&&NET.roomCode){rl.textContent=NET.roomLink();const wa=document.getElementById('waLink');if(wa)wa.href='https://wa.me/?text='+encodeURIComponent('Bora um racha? Entra na minha sala do Racha BR: '+NET.roomLink())}
  document.querySelectorAll('[data-netname]').forEach(el=>{el.textContent=NET.nameOf(NET.peer(el.dataset.netname))});
  document.querySelectorAll('[data-rankname]').forEach(el=>{const r=NET.rank.find(x=>x.id===el.dataset.rankname);el.textContent=(NET.names[el.dataset.rankname]||(r&&r.nick)||'Piloto')+(el.dataset.rankname===NET.myId?' (você)':'')});
  document.querySelectorAll('canvas[data-netpeer]').forEach(cv=>{const p=NET.peer(cv.dataset.netpeer);if(!p)return;const m=CAR[p.presence.car.m];drawPreview(cv,m,cleanVis(p.presence.car.vis,m),true)});
}
function vOnline(m){
  m.innerHTML=`<h2>Online com amigos</h2><p class="sub">Corrida ao vivo contra os amigos: cada um no próprio celular ou computador, com o próprio carro, e vocês se veem na pista.</p>
   <div class="panel" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><span style="font-weight:700">Seu apelido</span><input id="nick" maxlength="20" value="" style="flex:1;min-width:160px;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;font:inherit;font-weight:600"><button class="btn sm" data-act="nicksave">Salvar</button></div>
   <div id="netLive"></div>`;
  $('#nick').value=S.settings.nick||'';
  $('#netLive').innerHTML=netLiveHTML();bindNetCanvases();
}
function openChallenge(peerId){
  const p=NET.peer(peerId);if(!p)return;const max=Math.min(S.money,20000);
  modal(`<h2>Desafiar <span id="chName"></span></h2><p class="sub">Escolha o modo. A aposta sai do seu dinheiro e do dele; quem ganhar leva tudo.</p>
   <div class="modes" style="grid-template-columns:1fr 1fr"><button class="mode on" data-act="chmode" data-v="racha"><b>Racha</b><span>1 contra 1 no trânsito</span></button><button class="mode" data-act="chmode" data-v="drag"><b>Arrancada</b><span>402 m lado a lado</span></button></div>
   <div style="display:flex;justify-content:space-between;font-weight:700"><span>Aposta</span><span id="chBetV">${fmt(0)}</span></div><input type="range" id="chBet" min="0" max="${max}" step="${Math.max(50,Math.round(max/20/50)*50)}" value="0">
   <div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="chsend" data-v="${peerId}">Enviar desafio</button></div>`);
  $('#chName').textContent=NET.nameOf(p);const b=$('#chBet');b.addEventListener('input',()=>$('#chBetV').textContent=fmt(+b.value));
}

function netWaitHUD(ctx,W,H,n){ctx.fillStyle='rgba(8,10,13,.82)';const tw=Math.min(520,W-30);ctx.fillRect((W-tw)/2,H*.32,tw,92);ctx.textAlign='center';
  ctx.fillStyle='#ffd23d';ctx.font='22px "Russo One","Arial Black",sans-serif';ctx.fillText('AGUARDANDO SEU AMIGO',W/2,H*.32+38);
  ctx.fillStyle='#eef1f5';ctx.font='700 16px Rajdhani,Arial,sans-serif';ctx.fillText(n.oppName+' está carregando a pista…',W/2,H*.32+66)}
if(/^#sala-/i.test(location.hash))TAB='online';
render();
NET.init();
if(S.daily.last!==today()&&S.stats.races>0)setTimeout(()=>toast('Bônus diário disponível em Patrocínios'),800);
</script>
</body>
</html>
